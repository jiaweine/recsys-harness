[project]
name = "xushu-recsys-harness"
version = "0.1.0"
description = "Agent harness for search and recommendation optimization with evidence-driven evaluation, strategy evolution, and durable recovery."
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "search",
  "recommendation",
  "recsys",
  "ranking",
  "retrieval",
  "agent",
  "evaluation",
  "experimentation",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
semantic = ["FlagEmbedding==1.4.2"]
collaborative = ["implicit==0.7.3"]
optimizer = ["optuna==4.9.0"]
advanced = [
  "FlagEmbedding==1.4.2",
  "implicit==0.7.3",
  "optuna==4.9.0",
]

[project.scripts]
xushu-harness = "lingjing_harness.cli:main"

[project.urls]
Homepage = "https://github.com/jiaweine/recsys-harness"
Repository = "https://github.com/jiaweine/recsys-harness"
Documentation = "https://github.com/jiaweine/recsys-harness/tree/main/docs"
Issues = "https://github.com/jiaweine/recsys-harness/issues"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lingjing_harness*", "frontend"]
exclude = ["tests*", "scripts*", "docs*", "data*"]

[tool.setuptools.package-data]
frontend = ["*.html", "*.css", "*.js"]
