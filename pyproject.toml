[project]
name = "xushu-recsys-harness"
version = "0.1.0"
description = "Xushu: a project-owned agent harness for search and recommendation experience optimization."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
xushu-harness = "lingjing_harness.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lingjing_harness*", "frontend"]
exclude = ["tests*", "scripts*", "docs*", "data*"]

[tool.setuptools.package-data]
frontend = ["*.html", "*.css", "*.js"]
