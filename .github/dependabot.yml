version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 4
    # Runtime constraints include transitive packages for reproducible builds,
    # but version-update PRs should originate from product-owned direct deps.
    # Container QA then proves whether the lock must be regenerated atomically.
    allow:
      - dependency-name: "fastapi"
      - dependency-name: "uvicorn"
      - dependency-name: "pydantic"
      - dependency-name: "python-multipart"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    # The runtime lock and test matrix are Python 3.11 contracts. Keep digest
    # maintenance on that line; a Python minor/major migration is a deliberate
    # compatibility project, not an unattended dependency bump.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    commit-message:
      prefix: "deps"
