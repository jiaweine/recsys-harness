name: Refresh README product assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "lingjing_harness/**"
      - "scripts/capture_readme_assets.py"
      - ".github/workflows/readme-assets.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LINGJING_DATA_DIR: /tmp/recsys-readme-capture
      RECSYS_CAPTURE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app and browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Start Recsys Harness
        run: |
          rm -rf "$LINGJING_DATA_DIR"
          python -m uvicorn lingjing_harness.api:app --host 127.0.0.1 --port 8765 > /tmp/recsys-harness.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/api/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/recsys-harness.log
          exit 1

      - name: Capture real product screenshots
        run: python scripts/capture_readme_assets.py

      - name: Upload visual QA bundle
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: |
            docs/readme-assets/product-workbench.png
            docs/readme-assets/product-run.png
            docs/readme-assets/product-evidence.png
            docs/readme-assets/product-mobile.png
          retention-days: 5

      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/readme-assets/product-workbench.png docs/readme-assets/product-run.png docs/readme-assets/product-evidence.png docs/readme-assets/product-mobile.png
          if git diff --cached --quiet; then
            echo "README screenshots are already current."
            exit 0
          fi
          git commit -m "Refresh README product screenshots"
          git push
