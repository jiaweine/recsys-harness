# Visual QA screenshots are captured from the real running product after motion settles.
name: Refresh README product assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "lingjing_harness/**"
      - "scripts/capture_readme_assets.py"
      - ".github/workflows/readme-assets.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LINGJING_DATA_DIR: /tmp/recsys-readme-capture
      RECSYS_CAPTURE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app and browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Start Recsys Harness
        run: |
          rm -rf "$LINGJING_DATA_DIR"
          python -m uvicorn lingjing_harness.api:app --host 127.0.0.1 --port 8765 > /tmp/recsys-harness.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/api/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/recsys-harness.log
          exit 1

      - name: Capture real product screenshots
        run: python scripts/capture_readme_assets.py

      - name: Upload visual QA bundle
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: |
            docs/readme-assets/workbench.png
            docs/readme-assets/overview.png
            docs/readme-assets/evidence.png
            docs/readme-assets/mobile.png
          retention-days: 5

      - name: Publish screenshots, prewarm CDN, and pin README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/readme-assets/workbench.png docs/readme-assets/overview.png docs/readme-assets/evidence.png docs/readme-assets/mobile.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh README product screenshots"
            # The commit must exist remotely before an independent CDN can fetch it.
            git push
          else
            echo "README screenshots are already current."
          fi

          asset_sha="$(git rev-parse HEAD)"
          export ASSET_SHA="$asset_sha"
          cdn_base="https://cdn.jsdelivr.net/gh/jiaweine/recsys-harness@${asset_sha}/docs/readme-assets"

          # Prewarm and validate the independent CDN before README points at it.
          for name in overview.png workbench.png evidence.png mobile.png architecture.svg; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 45 \
              -A "Mozilla/5.0 recsys-readme-assets" \
              "${cdn_base}/${name}" -o "/tmp/${name}"
            test -s "/tmp/${name}"
          done

          python - <<'PY'
          from pathlib import Path
          import os
          import re

          for name in ('overview.png', 'workbench.png', 'evidence.png', 'mobile.png'):
              data = Path('/tmp', name).read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n'), f'{name} is not a PNG'
          assert '<svg' in Path('/tmp/architecture.svg').read_text(encoding='utf-8'), 'architecture.svg is not SVG'

          sha = os.environ['ASSET_SHA']
          base = f'https://cdn.jsdelivr.net/gh/jiaweine/recsys-harness@{sha}/docs/readme-assets'
          targets = {
              'Recsys Harness 真实运行界面': 'overview.png',
              'Recsys Harness 工作台': 'workbench.png',
              'Recsys Harness 证据面板': 'evidence.png',
              'Recsys Harness 移动端': 'mobile.png',
              'Recsys Harness system architecture': 'architecture.svg',
          }
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          for alt, name in targets.items():
              pattern = re.compile(r'!\[' + re.escape(alt) + r'\]\([^\n)]+\)')
              replacement = f'![{alt}]({base}/{name})'
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'could not uniquely update README image: {alt}')
          readme.write_text(text if text.endswith('\n') else text + '\n', encoding='utf-8')
          PY

          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Pin README product assets to resilient CDN"
            git push
          else
            echo "README asset URLs are already pinned."
          fi
