# Visual QA screenshots are captured from the real running product after motion settles.
name: Visual QA / README product assets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "DESIGN.md"
      - "frontend/**"
      - "lingjing_harness/**"
      - "scripts/capture_readme_assets.py"
      - "scripts/check_run_library.py"
      - "scripts/check_workspace_switcher.py"
      - "scripts/check_run_context.py"
      - "scripts/check_theme_modes.py"
      - "scripts/check_evidence_navigation.py"
      - "scripts/check_runtime_response_cache.py"
      - "docs/readme-assets/architecture.svg"
      - ".github/workflows/readme-assets.yml"
  push:
    branches: [main]
    paths:
      - "DESIGN.md"
      - "frontend/**"
      - "lingjing_harness/**"
      - "scripts/capture_readme_assets.py"
      - "scripts/check_run_library.py"
      - "scripts/check_workspace_switcher.py"
      - "scripts/check_run_context.py"
      - "scripts/check_theme_modes.py"
      - "scripts/check_evidence_navigation.py"
      - "scripts/check_runtime_response_cache.py"
      - "docs/readme-assets/architecture.svg"
      - ".github/workflows/readme-assets.yml"

# Pull-request code is executed only with repository read access.  The only write
# token in this workflow belongs to the publish job, which never runs for PRs.
permissions:
  contents: read

concurrency:
  group: readme-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LINGJING_DATA_DIR: /tmp/recsys-readme-capture
      RECSYS_CAPTURE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install app and browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Reject CSP-incompatible Playwright waits
        run: |
          python - <<'PY'
          from pathlib import Path

          scripts = (
              "scripts/capture_readme_assets.py",
              "scripts/check_run_library.py",
              "scripts/check_workspace_switcher.py",
              "scripts/check_run_context.py",
              "scripts/check_theme_modes.py",
              "scripts/check_evidence_navigation.py",
              "scripts/check_runtime_response_cache.py",
          )
          offenders = [path for path in scripts if ".wait_for_function(" in Path(path).read_text(encoding="utf-8")]
          if offenders:
              raise SystemExit("Visual QA must remain compatible with strict CSP; replace wait_for_function with locator/expect or Python polling: " + ", ".join(offenders))
          PY

      - name: Start Recsys Harness
        run: |
          rm -rf "$LINGJING_DATA_DIR"
          python -m uvicorn lingjing_harness.api:app --host 127.0.0.1 --port 8765 > /tmp/recsys-harness.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/api/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/recsys-harness.log
          exit 1

      - name: Capture real product screenshots
        run: python scripts/capture_readme_assets.py

      - name: Verify Run Library states
        run: python scripts/check_run_library.py

      - name: Verify Workspace Switcher
        run: python scripts/check_workspace_switcher.py

      - name: Verify Run Context Strip
        run: python scripts/check_run_context.py

      - name: Verify regular and dark theme modes
        run: python scripts/check_theme_modes.py

      - name: Verify ranked result evidence navigation
        run: python scripts/check_evidence_navigation.py

      - name: Verify shared runtime response parsing
        run: python scripts/check_runtime_response_cache.py

      - name: Upload visual QA bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-qa
          path: |
            docs/readme-assets/workbench.png
            docs/readme-assets/overview.png
            docs/readme-assets/evidence.png
            docs/readme-assets/mobile-workspace.png
            docs/readme-assets/mobile-progress.png
            docs/readme-assets/mobile-evidence.png
          retention-days: 5

      - name: Download visual QA bundle for round-trip verification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: visual-qa
          path: /tmp/visual-qa-roundtrip

      - name: Verify visual QA artifact round trip
        shell: bash
        run: |
          for name in workbench.png overview.png evidence.png mobile-workspace.png mobile-progress.png mobile-evidence.png; do
            cmp "docs/readme-assets/${name}" "/tmp/visual-qa-roundtrip/${name}"
          done

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Refuse to publish stale capture artifacts
        id: freshness
        shell: bash
        run: |
          current="$(git rev-parse HEAD)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::notice::main advanced from $GITHUB_SHA to $current; a newer workflow owns README asset publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download verified visual QA bundle
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: visual-qa
          path: docs/readme-assets

      - name: Publish screenshots and advance README when CDN is ready
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            docs/readme-assets/workbench.png \
            docs/readme-assets/overview.png \
            docs/readme-assets/evidence.png \
            docs/readme-assets/mobile-workspace.png \
            docs/readme-assets/mobile-progress.png \
            docs/readme-assets/mobile-evidence.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh README product screenshots"
            # Publish the immutable asset commit before asking the independent CDN for it.
            git push origin HEAD:main
          else
            echo "README screenshots are already current."
          fi

          asset_sha="$(git rev-parse HEAD)"
          export ASSET_SHA="$asset_sha"
          cdn_base="https://cdn.jsdelivr.net/gh/jiaweine/recsys-harness@${asset_sha}/docs/readme-assets"
          cdn_ready=1

          # CDN propagation can lag a fresh Git commit. That must never turn a
          # successful browser QA run into a failure or replace a known-good
          # README image set with URLs that are not ready yet.
          for name in overview.png workbench.png evidence.png mobile-workspace.png mobile-progress.png mobile-evidence.png architecture.svg; do
            rm -f "/tmp/${name}"
            if ! curl -fsSL --retry 2 --retry-all-errors --retry-delay 2 \
              --connect-timeout 8 --max-time 20 \
              -A "Mozilla/5.0 recsys-readme-assets" \
              "${cdn_base}/${name}" -o "/tmp/${name}"; then
              cdn_ready=0
              break
            fi
            if ! test -s "/tmp/${name}"; then
              cdn_ready=0
              break
            fi
          done

          if [ "$cdn_ready" = "1" ]; then
            if ! python - <<'PY'
          from pathlib import Path

          for name in (
              'overview.png',
              'workbench.png',
              'evidence.png',
              'mobile-workspace.png',
              'mobile-progress.png',
              'mobile-evidence.png',
          ):
              data = Path('/tmp', name).read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n'), f'{name} is not a PNG'
          assert '<svg' in Path('/tmp/architecture.svg').read_text(encoding='utf-8'), 'architecture.svg is not SVG'
          PY
            then
              cdn_ready=0
            fi
          fi

          if [ "$cdn_ready" != "1" ]; then
            echo "::warning::New screenshot commit is published, but the independent CDN is still propagating it. Keeping the README image URLs unchanged until the next successful refresh."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          import os
          import re

          sha = os.environ['ASSET_SHA']
          base = f'https://cdn.jsdelivr.net/gh/jiaweine/recsys-harness@{sha}/docs/readme-assets'
          targets = (
              'overview.png',
              'workbench.png',
              'evidence.png',
              'mobile-workspace.png',
              'mobile-progress.png',
              'mobile-evidence.png',
              'architecture.svg',
          )
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          for name in targets:
              pattern = re.compile(
                  r'https://cdn\.jsdelivr\.net/gh/jiaweine/recsys-harness@[0-9a-f]+/docs/readme-assets/'
                  + re.escape(name)
              )
              text, count = pattern.subn(f'{base}/{name}', text, count=1)
              if count != 1:
                  raise SystemExit(f'could not uniquely update README asset URL: {name}')
          readme.write_text(text if text.endswith('\n') else text + '\n', encoding='utf-8')
          PY

          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Pin README product assets to verified CDN"
            git push origin HEAD:main
          else
            echo "README asset URLs are already pinned."
          fi
