# Visual QA screenshots are captured from the real running product after motion settles.
name: Visual QA / README product assets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "DESIGN.md"
      - "frontend/**"
      - "lingjing_harness/**"
      - "scripts/capture_readme_assets.py"
      - "scripts/check_run_library.py"
      - "scripts/check_workspace_switcher.py"
      - "scripts/check_run_context.py"
      - "scripts/check_theme_modes.py"
      - "docs/readme-assets/architecture.svg"
      - ".github/workflows/readme-assets.yml"
  push:
    branches: [main]
    paths:
      - "DESIGN.md"
      - "frontend/**"
      - "lingjing_harness/**"
      - "scripts/capture_readme_assets.py"
      - "scripts/check_run_library.py"
      - "scripts/check_workspace_switcher.py"
      - "scripts/check_run_context.py"
      - "scripts/check_theme_modes.py"
      - "docs/readme-assets/architecture.svg"
      - ".github/workflows/readme-assets.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LINGJING_DATA_DIR: /tmp/recsys-readme-capture
      RECSYS_CAPTURE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app and browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Start Recsys Harness
        run: |
          rm -rf "$LINGJING_DATA_DIR"
          python -m uvicorn lingjing_harness.api:app --host 127.0.0.1 --port 8765 > /tmp/recsys-harness.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/api/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/recsys-harness.log
          exit 1

      - name: Capture real product screenshots
        run: python scripts/capture_readme_assets.py

      - name: Verify Run Library states
        run: python scripts/check_run_library.py

      - name: Verify Workspace Switcher
        run: python scripts/check_workspace_switcher.py

      - name: Verify Run Context Strip
        run: python scripts/check_run_context.py

      - name: Verify regular and dark theme modes
        run: python scripts/check_theme_modes.py

      - name: Upload visual QA bundle
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: |
            docs/readme-assets/workbench.png
            docs/readme-assets/overview.png
            docs/readme-assets/evidence.png
            docs/readme-assets/mobile-workspace.png
            docs/readme-assets/mobile-progress.png
            docs/readme-assets/mobile-evidence.png
          retention-days: 5

      - name: Publish screenshots and advance README when CDN is ready
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            docs/readme-assets/workbench.png \
            docs/readme-assets/overview.png \
            docs/readme-assets/evidence.png \
            docs/readme-assets/mobile-workspace.png \
            docs/readme-assets/mobile-progress.png \
            docs/readme-assets/mobile-evidence.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh README product screenshots"
            # Publish the immutable asset commit before asking the independent CDN for it.
            git push
          else
            echo "README screenshots are already current."
          fi

          asset_sha="$(git rev-parse HEAD)"
          export ASSET_SHA="$asset_sha"
          cdn_base="https://cdn.jsdelivr.net/gh/jiaweine/recsys-harness@${asset_sha}/docs/readme-assets"
          cdn_ready=1

          # CDN propagation can lag a fresh Git commit. That must never turn a
          # successful browser QA run into a failure or replace a known-good
          # README image set with URLs that are not ready yet.
          for name in overview.png workbench.png evidence.png mobile-workspace.png mobile-progress.png mobile-evidence.png architecture.svg; do
            rm -f "/tmp/${name}"
            if ! curl -fsSL --retry 2 --retry-all-errors --retry-delay 2 \
              --connect-timeout 8 --max-time 20 \
              -A "Mozilla/5.0 recsys-readme-assets" \
              "${cdn_base}/${name}" -o "/tmp/${name}"; then
              cdn_ready=0
              break
            fi
            if ! test -s "/tmp/${name}"; then
              cdn_ready=0
              break
            fi
          done

          if [ "$cdn_ready" = "1" ]; then
            if ! python - <<'PY'
          from pathlib import Path

          for name in (
              'overview.png',
              'workbench.png',
              'evidence.png',
              'mobile-workspace.png',
              'mobile-progress.png',
              'mobile-evidence.png',
          ):
              data = Path('/tmp', name).read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n'), f'{name} is not a PNG'
          assert '<svg' in Path('/tmp/architecture.svg').read_text(encoding='utf-8'), 'architecture.svg is not SVG'
          PY
            then
              cdn_ready=0
            fi
          fi

          if [ "$cdn_ready" != "1" ]; then
            echo "::warning::New screenshot commit is published, but the independent CDN is still propagating it. Keeping the README image URLs unchanged until the next successful refresh."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          import os
          import re

          sha = os.environ['ASSET_SHA']
          base = f'https://cdn.jsdelivr.net/gh/jiaweine/recsys-harness@{sha}/docs/readme-assets'
          targets = (
              'overview.png',
              'workbench.png',
              'evidence.png',
              'mobile-workspace.png',
              'mobile-progress.png',
              'mobile-evidence.png',
              'architecture.svg',
          )
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          for name in targets:
              pattern = re.compile(
                  r'https://cdn\.jsdelivr\.net/gh/jiaweine/recsys-harness@[0-9a-f]+/docs/readme-assets/'
                  + re.escape(name)
              )
              text, count = pattern.subn(f'{base}/{name}', text, count=1)
              if count != 1:
                  raise SystemExit(f'could not uniquely update README asset URL: {name}')
          readme.write_text(text if text.endswith('\n') else text + '\n', encoding='utf-8')
          PY

          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Pin README product assets to verified CDN"
            git push
          else
            echo "README asset URLs are already pinned."
          fi
