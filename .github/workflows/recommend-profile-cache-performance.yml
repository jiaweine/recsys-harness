name: Recommend Profile Cache Performance

on:
  push:
    branches:
      - perf/recommend-profile-cache
  pull_request:
    paths:
      - "lingjing_harness/algorithms/recommend_core.py"
      - "tests/test_recommend_profile_cache.py"
      - "scripts/recommend_profile_cache_benchmark.py"
      - ".github/workflows/recommend-profile-cache-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Benchmark cached warm recommendation profile
        run: |
          for pass in 1 2 3; do
            echo "recommend profile cache pass $pass/3"
            python scripts/recommend_profile_cache_benchmark.py \
              --items 30000 \
              --history 5000 \
              --repeats 7 \
              --max-optimized-p50-ms 230 \
              --min-prepare-speedup 1.15 \
              --min-full-speedup 1.12
          done
