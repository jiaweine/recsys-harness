name: Search Semantic Rescue Performance

on:
  push:
    branches:
      - perf/bound-search-semantic-rescue
  pull_request:
    paths:
      - "lingjing_harness/algorithms/search.py"
      - "tests/test_search_semantic_rescue_hotpath.py"
      - "scripts/search_semantic_rescue_benchmark.py"
      - ".github/workflows/search-semantic-rescue-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Verify semantic rescue hot path
        run: pytest -q tests/test_search_semantic_rescue_hotpath.py
      - name: Benchmark bounded semantic rescue
        run: |
          for pass in 1 2 3; do
            echo "semantic-rescue performance pass $pass/3"
            python scripts/search_semantic_rescue_benchmark.py \
              --items 50000 \
              --anchors 24 \
              --repeats 7 \
              --max-current-p50-ms 80 \
              --min-speedup 1.12
          done
