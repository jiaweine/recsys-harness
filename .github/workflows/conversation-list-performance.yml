name: Conversation List Performance

on:
  push:
    branches:
      - perf/conversation-list-hotpath
  pull_request:
    paths:
      - "lingjing_harness/store.py"
      - "tests/test_store.py"
      - "scripts/conversation_list_benchmark.py"
      - ".github/workflows/conversation-list-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Benchmark long-history conversation listing
        run: |
          for pass in 1 2 3; do
            echo "conversation-list performance pass $pass/3"
            python scripts/conversation_list_benchmark.py \
              --conversations 100000 \
              --active-runs 40 \
              --repeats 30 \
              --max-list-p50-ms 2.0 \
              --max-combined-p50-ms 3.0
          done
