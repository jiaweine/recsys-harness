name: Conversation List Performance

on:
  push:
    branches:
      - perf/conversation-list-hotpath
  pull_request:
    paths:
      - "lingjing_harness/api_core.py"
      - "lingjing_harness/store.py"
      - "scripts/conversation_list_benchmark.py"
      - ".github/workflows/conversation-list-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Benchmark conversation list
        run: |
          python scripts/conversation_list_benchmark.py \
            --conversations 100000 \
            --active-runs 40 \
            --repeats 30
