name: Apply visual quality refresh

on:
  push:
    branches: [main]
    paths:
      - ".upgrade/visual-refresh/**"
      - ".github/workflows/apply-visual-refresh.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LINGJING_DATA_DIR: /tmp/recsys-visual-refresh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify and unpack tested source
        run: |
          cat .upgrade/visual-refresh/chunk-* > /tmp/recsys-visual-refresh.b64
          base64 -d /tmp/recsys-visual-refresh.b64 > /tmp/recsys-visual-refresh.tar.gz
          echo "61cc971bedabb9d847c2bd065ca661180d724c96783c7bd608fbac7697c83118  /tmp/recsys-visual-refresh.tar.gz" | sha256sum -c -
          tar -xzf /tmp/recsys-visual-refresh.tar.gz
      - name: Install and verify product
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
          python -m compileall -q lingjing_harness tests scripts
          node --check frontend/app.js
          pytest -q
          python scripts/demo_smoke.py > /dev/null
          lingjing-harness '做一次全局体检' > /dev/null
          python - <<'PY'
          import re
          from pathlib import Path
          root=Path('.')
          frontend='\n'.join((root/'frontend'/p).read_text('utf-8') for p in ['index.html','app.css','app.js'])
          low=frontend.lower()
          forbidden=['deepseek','claude','chatgpt','openai','qwen','searxng','bm25','ndcg','mrr','mmr','向量','召回','重排']
          assert not [x for x in forbidden if x in low]
          css=(root/'frontend/app.css').read_text('utf-8')
          assert '@import url(' not in css and 'fonts.googleapis' not in css
          assert 'gradient(' not in css and 'backdrop-filter' not in css
          vals=[int(v) for d in re.findall(r'font-size:\s*([^;}\n]+)',css) for v in re.findall(r'(\d+)px',d)]
          assert vals and min(vals)>=10 and max(vals)<=42, (min(vals),max(vals))
          print('visual hygiene ok', min(vals), max(vals))
          PY
      - name: Commit verified product files
        run: |
          rm -rf .upgrade/visual-refresh build dist .pytest_cache
          rm -rf ./*.egg-info lingjing_harness/**/__pycache__ frontend/__pycache__ tests/__pycache__ scripts/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.css frontend/index.html frontend/app.js lingjing_harness/api.py lingjing_harness/runtime/harness.py lingjing_harness/runtime/__init__.py tests/test_api.py docs/DESIGN.md README.md
          git add -u .upgrade/visual-refresh
          git commit -m "Refine product visual system and run controls"
          git push
