name: Runtime Persistence Performance

on:
  push:
    branches:
      - perf/runtime-persistence-hotpath
  pull_request:
    paths:
      - "lingjing_harness/api.py"
      - "lingjing_harness/api_core.py"
      - "lingjing_harness/store.py"
      - "scripts/runtime_persistence_benchmark.py"
      - ".github/workflows/runtime-persistence-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Benchmark durable runtime persistence
        run: |
          python scripts/runtime_persistence_benchmark.py \
            --repeats 50 \
            --event-count 80 \
            --event-payload-bytes 1024 \
            --messages 10000 \
            --max-save-fenced-p50-ms 10 \
            --max-assistant-lookup-miss-p50-ms 20 \
            --max-heartbeat-batch-p50-ms 20 \
            --min-heartbeat-speedup 5
