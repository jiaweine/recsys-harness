name: Task Start Performance

on:
  push:
    branches:
      - perf/task-start-atomicity
  pull_request:
    paths:
      - "lingjing_harness/api.py"
      - "lingjing_harness/api_core.py"
      - "lingjing_harness/api_message_start.py"
      - "lingjing_harness/store.py"
      - "tests/test_message_start_read_bounds.py"
      - "scripts/task_start_benchmark.py"
      - ".github/workflows/task-start-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Benchmark atomic task start
        run: |
          for pass in 1 2 3; do
            echo "task-start performance pass $pass/3"
            python scripts/task_start_benchmark.py \
              --repeats 40 \
              --max-atomic-p50-ms 3.0 \
              --min-store-speedup 1.8 \
              --max-api-p50-ms 30 \
              --max-api-p95-ms 100
          done
