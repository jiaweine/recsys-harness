name: Search Run Performance

on:
  pull_request:
    paths:
      - "lingjing_harness/algorithms/segments.py"
      - "lingjing_harness/runtime/tools.py"
      - "tests/test_search_run_hotpath.py"
      - "scripts/search_run_benchmark.py"
      - ".github/workflows/search-run-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Run targeted search hot-path tests
        run: pytest -q tests/test_search_run_hotpath.py
      - name: Benchmark owned search run
        run: |
          for pass in 1 2 3; do
            echo "search-run performance pass $pass/3"
            python scripts/search_run_benchmark.py \
              --items 6000 \
              --repeats 7 \
              --max-optimized-p50-ms 250 \
              --min-speedup 1.3
          done
