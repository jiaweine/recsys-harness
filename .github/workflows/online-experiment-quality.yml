name: Online Experiment Quality

on:
  push:
    paths:
      - '.github/workflows/online-experiment-quality.yml'
      - 'lingjing_harness/online_experiments.py'
      - 'lingjing_harness/experiments.py'
      - 'scripts/online_experiment_sequential_calibration.py'
      - 'tests/test_online_experiments.py'
      - 'tests/test_online_experiment_calibration.py'
  pull_request:
    paths:
      - '.github/workflows/online-experiment-quality.yml'
      - 'lingjing_harness/online_experiments.py'
      - 'lingjing_harness/experiments.py'
      - 'scripts/online_experiment_sequential_calibration.py'
      - 'tests/test_online_experiments.py'
      - 'tests/test_online_experiment_calibration.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sequential-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Compile online experiment plane
        run: |
          python -m compileall -q \
            lingjing_harness/online_experiments.py \
            scripts/online_experiment_sequential_calibration.py \
            tests/test_online_experiments.py \
            tests/test_online_experiment_calibration.py
      - name: Run online experiment contract tests
        run: |
          pytest -q \
            tests/test_online_experiments.py \
            tests/test_online_experiment_calibration.py
      - name: Run repeated-peeking null calibration smoke
        run: |
          python scripts/online_experiment_sequential_calibration.py \
            --trials 300 \
            --seed 20260830 \
            > /tmp/online-experiment-calibration.json
          cat /tmp/online-experiment-calibration.json
