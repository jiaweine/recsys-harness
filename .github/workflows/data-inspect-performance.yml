name: Data Inspect Performance

on:
  pull_request:
    paths:
      - "lingjing_harness/algorithms/segments.py"
      - "lingjing_harness/runtime/tools_core.py"
      - "lingjing_harness/runtime/tools_production.py"
      - "lingjing_harness/runtime/tools.py"
      - "tests/test_segment_portfolio.py"
      - "tests/test_data_inspect_cache.py"
      - "scripts/data_inspect_benchmark.py"
      - ".github/workflows/data-inspect-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Benchmark steady data inspect
        run: |
          for pass in 1 2 3; do
            echo "data-inspect performance pass $pass/3"
            python scripts/data_inspect_benchmark.py \
              --requests-per-surface 300 \
              --interactions 20000 \
              --repeats 7 \
              --max-optimized-p50-ms 5 \
              --min-speedup 10
          done
