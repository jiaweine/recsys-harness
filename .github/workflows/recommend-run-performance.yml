name: Recommend Run Performance

on:
  push:
    branches:
      - perf/recommend-run-hotpath
  pull_request:
    paths:
      - "lingjing_harness/runtime/tools.py"
      - "lingjing_harness/algorithms/recommend_core.py"
      - "lingjing_harness/algorithms/segments.py"
      - "tests/test_recommend_prepare_hotloop.py"
      - "scripts/recommend_run_benchmark.py"
      - ".github/workflows/recommend-run-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Benchmark warm recommendation run
        run: |
          for pass in 1 2 3; do
            echo "warm recommendation pass $pass/3"
            python scripts/recommend_run_benchmark.py \
              --items 30000 \
              --history 5000 \
              --repeats 7 \
              --max-optimized-p50-ms 400 \
              --min-prepare-speedup 1.06 \
              --min-full-speedup 1.05
          done
      - name: Benchmark cold recommendation run
        run: |
          python scripts/recommend_run_benchmark.py \
            --items 30000 \
            --history 0 \
            --repeats 7 \
            --max-optimized-p50-ms 220
