name: Recommend Relevance Vector Performance

on:
  pull_request:
    paths:
      - "lingjing_harness/algorithms/recommend_validation.py"
      - "tests/test_recommend_relevance_vector_hotpath.py"
      - "scripts/recommend_relevance_vector_benchmark.py"
      - ".github/workflows/recommend-relevance-vector-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Verify shared temporal relevance vectors
        run: pytest -q tests/test_recommend_relevance_vector_hotpath.py
      - name: Benchmark shared temporal relevance vectors
        run: |
          for pass in 1 2 3; do
            echo "recommend-relevance-vector performance pass $pass/3"
            python scripts/recommend_relevance_vector_benchmark.py \
              --items 4000 \
              --users 8 \
              --repeats 5 \
              --max-optimized-p50-ms 600 \
              --min-speedup 4.0
          done
