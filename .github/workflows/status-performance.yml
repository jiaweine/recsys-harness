name: Status Performance

on:
  push:
    branches:
      - perf/status-hotpath
  pull_request:
    paths:
      - "lingjing_harness/api_core.py"
      - "lingjing_harness/domain.py"
      - "scripts/status_hotpath_benchmark.py"
      - ".github/workflows/status-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Benchmark status catalog summary
        run: |
          python scripts/status_hotpath_benchmark.py \
            --items 20000 \
            --interactions 200000 \
            --events 100000 \
            --repeats 30
