name: Segment Router Fork Performance

on:
  pull_request:
    paths:
      - "lingjing_harness/algorithms/segments.py"
      - "lingjing_harness/runtime/tools.py"
      - "tests/test_segment_portfolio.py"
      - "scripts/segment_router_fork_benchmark.py"
      - ".github/workflows/segment-router-fork-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Benchmark production task forks
        run: |
          for pass in 1 2 3; do
            echo "segment-router fork performance pass $pass/3"
            python scripts/segment_router_fork_benchmark.py \
              --requests-per-surface 300 \
              --repeats 7 \
              --max-optimized-p50-ms 20 \
              --min-speedup 3.0
          done
