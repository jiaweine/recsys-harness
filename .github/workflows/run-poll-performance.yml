name: Run Poll Performance\n\non:\n  push:\n    branches:\n      - perf/run-poll-hotpath\n  pull_request:\n    paths:\n      - "lingjing_harness/api.py"\n      - "lingjing_harness/store.py"\n      - "scripts/run_poll_benchmark.py"\n      - ".github/workflows/run-poll-performance.yml"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  benchmark:\n    runs-on: ubuntu-latest\n    timeout-minutes: 12\n    strategy:\n      fail-fast: false\n      matrix:\n        include:\n          - label: medium\n            events: 80\n            payload_bytes: 4096\n          - label: large\n            events: 160\n            payload_bytes: 8192\n    steps:\n      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1\n      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97\n        with:\n          python-version: "3.11"\n          cache: pip\n      - run: pip install -r requirements.txt\n      - run: pip install -e . --no-deps\n      - name: Benchmark active run polling (${{ matrix.label }})\n        run: |\n          python scripts/run_poll_benchmark.py \\\n            --events ${{ matrix.events }} \\\n            --payload-bytes ${{ matrix.payload_bytes }} \\\n            --repeats 120 \\\n            --workers 8\n