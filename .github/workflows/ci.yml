name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - run: python -m compileall -q lingjing_harness tests scripts
      - run: pytest -q
      - name: Durable store contention stress smoke
        run: python scripts/stress_smoke.py --workers 8 --iterations 25 --processes 4
      - name: API lifecycle contention stress smoke
        run: python scripts/api_stress_smoke.py --workers 6 --race 8
      - run: python scripts/demo_smoke.py > /dev/null
      - run: python scripts/probe_harness_contract.py > /dev/null
      - run: xushu-harness '做一次全局体检' > /dev/null
      - name: Product hygiene gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          frontend_paths = [
              Path('frontend/index.html'),
              *sorted(Path('frontend').glob('*.js')),
              *sorted(Path('frontend').glob('*.css')),
          ]
          frontend = '\n'.join(path.read_text(encoding='utf-8') for path in frontend_paths)
          lower = frontend.lower()
          forbidden_ui = [
              'deepseek', 'claude', 'chatgpt', 'openai', 'qwen', 'searxng',
              'bm25', 'embedding', '向量', '召回', '重排', 'ndcg', 'mrr', 'mmr', 'policy model',
          ]
          hits = [term for term in forbidden_ui if term in lower]
          assert not hits, f'customer UI leaked internal/third-party terms: {hits}'
          assert '灵境' not in frontend and 'lingjing' not in lower, 'legacy product branding leaked into customer UI'
          assert '序枢' in frontend, 'Xushu product branding missing from customer UI'

          css = '\n'.join(path.read_text(encoding='utf-8') for path in sorted(Path('frontend').glob('*.css')))
          css_lower = css.lower()
          assert '@import' not in css_lower and 'fonts.googleapis' not in css_lower, 'remote font dependency detected'
          assert 'gradient(' not in css_lower, 'generic gradient styling detected'
          assert 'backdrop-filter' not in css_lower, 'glass blur styling detected'
          sizes = [int(value) for value in re.findall(r'font-size:\s*(\d+)px', css)]
          assert not [value for value in sizes if value < 10], 'font size below 10px detected'
          declarations = re.findall(r'font-size:\s*([^;}\n]+)', css)
          type_values = [int(value) for declaration in declarations for value in re.findall(r'(\d+)px', declaration)]
          assert not [value for value in type_values if value > 38], 'product type scale exceeds 38px'

          readme = Path('README.md').read_text(encoding='utf-8')
          assert 'raw.githubusercontent.com' not in readme, 'README must not depend on GitHub Raw CDN'
          assert '/raw/main/' not in readme, 'README must not depend on GitHub raw/main route'
          asset_names = (
              'overview.png',
              'workbench.png',
              'evidence.png',
              'mobile-workspace.png',
              'mobile-progress.png',
              'mobile-evidence.png',
              'architecture.svg',
          )
          refs = re.findall(
              r'https://cdn\.jsdelivr\.net/gh/jiaweine/recsys-harness@([0-9a-f]{40})/docs/readme-assets/([^\s\"\')]+)',
              readme,
          )
          matched = {name: sha for sha, name in refs if name in asset_names}
          assert set(matched) == set(asset_names), f'README asset refs incomplete: {matched}'
          assert len(set(matched.values())) == 1, f'README assets must pin one immutable commit: {matched}'
          for name in asset_names:
              asset = Path('docs/readme-assets', name)
              assert asset.is_file() and asset.stat().st_size > 100, f'missing README asset: {asset}'

          control_files = [
              Path('lingjing_harness/api.py'),
              Path('lingjing_harness/algorithms/evolution.py'),
              *Path('lingjing_harness/runtime').glob('*.py'),
              *Path('tests').glob('test_*.py'),
          ]
          control = '\n'.join(path.read_text(encoding='utf-8') for path in control_files if path.exists())
          assert not re.search(r'(?i)(^|[^a-z0-9])v[1-4]([^a-z0-9]|$)|api/v[1-4]|_v[1-4]', control), 'numbered historical product path detected'
          legacy_patterns = {
              ('base' + 'line'): r'(?<![a-z0-9_])baseline(?![a-z0-9_])',
              ('com' + 'pare'): r'(?<![a-z0-9_])compare(?![a-z0-9_])',
              ('shadow_' + 'compare'): r'(?<![a-z0-9_])shadow_compare(?![a-z0-9_])',
          }
          legacy_hits = [
              term for term, pattern in legacy_patterns.items()
              if re.search(pattern, control.lower())
          ]
          assert not legacy_hits, f'legacy decision-path terminology detected: {legacy_hits}'

          import subprocess
          names = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          generated = [name for name in names if name.startswith(('build/', 'dist/')) or '.egg-info/' in name]
          assert not generated, f'generated packaging artifacts are tracked: {generated[:5]}'
          PY
      - name: Verify wheel contains the web product
        run: |
          rm -rf /tmp/recsys-wheel /tmp/recsys-installed
          mkdir -p /tmp/recsys-wheel /tmp/recsys-installed
          python -m pip wheel . --no-deps -w /tmp/recsys-wheel
          python -m pip install /tmp/recsys-wheel/*.whl --no-deps --target /tmp/recsys-installed
          cd /tmp
          PYTHONPATH=/tmp/recsys-installed python - <<'PY'
          from fastapi.testclient import TestClient
          from lingjing_harness.api import app
          with TestClient(app) as client:
              page = client.get('/')
              layout = client.get('/assets/layout.css')
              theme_css = client.get('/assets/theme-modes.css')
              theme_controls = client.get('/assets/theme-controls.css')
              dark_charcoal = client.get('/assets/dark-charcoal.css')
              theme_js = client.get('/assets/theme.js')
              trace_css = client.get('/assets/trace-ui.css')
              trace_js = client.get('/assets/trace-ui.js')
              control_css = client.get('/assets/control-ui.css')
              control_js = client.get('/assets/control-ui.js')
              nav_css = client.get('/assets/run-nav.css')
              nav_js = client.get('/assets/run-nav.js')
              compare_css = client.get('/assets/run-compare.css')
              compare_js = client.get('/assets/run-compare.js')
              library_css = client.get('/assets/run-library.css')
              library_js = client.get('/assets/run-library.js')
              context_css = client.get('/assets/run-context.css')
              context_js = client.get('/assets/run-context.js')
              evidence_link_css = client.get('/assets/evidence-link.css')
              evidence_link_js = client.get('/assets/evidence-link.js')
              status = client.get('/api/status')
              capabilities = client.get('/api/capabilities')
          assert page.status_code == 200
          assert '序枢' in page.text and '灵境' not in page.text
          assert 'data-theme="light"' in page.text and '常规' in page.text and '暗色' in page.text
          assert '/assets/theme.js' in page.text and '/assets/theme-modes.css' in page.text and '/assets/theme-controls.css' in page.text
          assert '/assets/dark-charcoal.css' in page.text
          assert '/assets/trace-ui.css' in page.text and '/assets/trace-ui.js' in page.text
          assert '/assets/control-ui.css' in page.text and '/assets/control-ui.js' in page.text
          assert '/assets/run-nav.css' in page.text and '/assets/run-nav.js' in page.text
          assert '/assets/run-compare.css' in page.text and '/assets/run-compare.js' in page.text
          assert '/assets/run-library.css' in page.text and '/assets/run-library.js' in page.text
          assert '/assets/run-context.css' in page.text and '/assets/run-context.js' in page.text
          assert '/assets/evidence-link.css' in page.text and '/assets/evidence-link.js' in page.text
          assert layout.status_code == 200 and 'Focused Workspace' in layout.text
          assert theme_css.status_code == 200 and 'Dual-theme workspace' in theme_css.text and 'data-theme="light"' in theme_css.text
          assert theme_controls.status_code == 200 and 'Theme control sizing' in theme_controls.text
          assert dark_charcoal.status_code == 200 and 'Graphite Charcoal' in dark_charcoal.text and 'data-theme="dark"' in dark_charcoal.text
          assert theme_js.status_code == 200 and 'xushu-theme' in theme_js.text and 'data-theme-choice' in theme_js.text
          assert trace_css.status_code == 200 and 'Mission + Agent Trace Inspector' in trace_css.text
          assert trace_js.status_code == 200 and 'AGENT TRACE' in trace_js.text
          assert control_css.status_code == 200 and 'Control Plane + Learning Ledger' in control_css.text
          assert control_js.status_code == 200 and 'CONTROL PLANE' in control_js.text and 'LEARNING LEDGER' in control_js.text
          assert nav_css.status_code == 200 and 'Workspace Switcher' in nav_css.text
          assert nav_js.status_code == 200 and '工作区导航' in nav_js.text and 'historyCommands' in nav_js.text and 'escapeHtml' in nav_js.text
          assert compare_css.status_code == 200 and 'Run Compare' in compare_css.text
          assert compare_js.status_code == 200 and 'RUN COMPARE' in compare_js.text and 'XMLHttpRequest' in compare_js.text
          assert library_css.status_code == 200 and 'Run Library' in library_css.text
          assert library_js.status_code == 200 and 'history-state' in library_js.text and 'aria-current' in library_js.text
          assert context_css.status_code == 200 and 'Run Context Strip' in context_css.text
          assert context_js.status_code == 200 and 'runContextStrip' in context_js.text and 'resultTargets' in context_js.text
          assert evidence_link_css.status_code == 200 and 'Ranked result' in evidence_link_css.text
          assert evidence_link_js.status_code == 200 and 'evidenceLinked' in evidence_link_js.text and 'findEvidence' in evidence_link_js.text
          assert status.status_code == 200 and status.json()['runtime']['evidence_utility_controller'] is True
          assert capabilities.status_code == 200 and capabilities.json()['multimodal']['attachments'] is True
          PY
      - name: Check frontend JavaScript syntax
        run: |
          for file in frontend/*.js; do
            node --check "$file"
          done