name: Run Poll Delta Performance

on:
  push:
    branches:
      - perf/run-poll-delta
  pull_request:
    paths:
      - "lingjing_harness/api.py"
      - "frontend/app.js"
      - "tests/test_run_poll_delta.py"
      - "scripts/run_poll_delta_benchmark.py"
      - ".github/workflows/run-poll-delta-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Benchmark run polling delta
        run: |
          python scripts/run_poll_delta_benchmark.py \
            --events 160 \
            --payload-bytes 8192 \
            --repeats 120 \
            --tail 2 \
            --min-byte-reduction-ratio 40 \
            --min-encode-speedup 20 \
            --max-delta-bytes 32768
