name: qLog Phase Profile

on:
  push:
    paths:
      - '.github/workflows/qlog-profile.yml'
      - 'scripts/qlog_phase_profile.py'
      - 'scripts/optimizer_equal_budget_benchmark.py'
      - 'lingjing_harness/algorithms/qlog_mobo.py'
      - 'lingjing_harness/algorithms/optimizer_backends.py'
      - 'lingjing_harness/algorithms/optimizer_contracts.py'
  pull_request:
    paths:
      - '.github/workflows/qlog-profile.yml'
      - 'scripts/qlog_phase_profile.py'
      - 'scripts/optimizer_equal_budget_benchmark.py'
      - 'lingjing_harness/algorithms/qlog_mobo.py'
      - 'lingjing_harness/algorithms/optimizer_backends.py'
      - 'lingjing_harness/algorithms/optimizer_contracts.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Install pinned BoTorch research stack
        run: pip install 'botorch==0.18.1' 'optuna==4.9.0'
      - name: Profile qLog fit and acquisition phases
        run: python scripts/qlog_phase_profile.py
