name: External Semantic Quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Install official FlagEmbedding release
        run: pip install 'FlagEmbedding==1.4.2'
      - name: Exercise BGE semantic backend through public AgentHarness
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python scripts/semantic_backend_smoke.py
