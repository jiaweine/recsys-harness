name: External Semantic Quality

on:
  push:
    paths:
      - '.github/workflows/external-semantic-quality.yml'
  workflow_dispatch:

jobs:
  bge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Install official FlagEmbedding release
        run: pip install 'FlagEmbedding==1.4.2'
      - name: Exercise BGE semantic backend
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python scripts/semantic_backend_smoke.py
