name: Online Experiment Control Plane

on:
  push:
    paths:
      - '.github/workflows/online-experiment-control-plane.yml'
      - 'lingjing_harness/api.py'
      - 'lingjing_harness/online_experiment_api.py'
      - 'lingjing_harness/online_experiment_store.py'
      - 'lingjing_harness/online_experiments.py'
      - 'scripts/online_experiment_store_stress.py'
      - 'tests/test_online_experiment_store.py'
      - 'tests/test_online_experiment_store_concurrency.py'
      - 'tests/test_online_experiment_api.py'
  pull_request:
    paths:
      - '.github/workflows/online-experiment-control-plane.yml'
      - 'lingjing_harness/api.py'
      - 'lingjing_harness/online_experiment_api.py'
      - 'lingjing_harness/online_experiment_store.py'
      - 'lingjing_harness/online_experiments.py'
      - 'scripts/online_experiment_store_stress.py'
      - 'tests/test_online_experiment_store.py'
      - 'tests/test_online_experiment_store_concurrency.py'
      - 'tests/test_online_experiment_api.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Compile durable experiment control plane
        run: |
          python -m compileall -q \
            lingjing_harness/online_experiment_store.py \
            lingjing_harness/online_experiment_api.py \
            lingjing_harness/api.py \
            scripts/online_experiment_store_stress.py \
            tests/test_online_experiment_store.py \
            tests/test_online_experiment_store_concurrency.py \
            tests/test_online_experiment_api.py
      - name: Run registry, API and concurrency contracts
        run: |
          pytest -q \
            tests/test_online_experiment_store.py \
            tests/test_online_experiment_store_concurrency.py \
            tests/test_online_experiment_api.py
      - name: Run multi-worker SQLite and CAS stress
        run: |
          python scripts/online_experiment_store_stress.py \
            --workers 8 \
            --units 2048 \
            | tee /tmp/online-experiment-store-stress.json
      - name: Verify no automatic traffic or production activation contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          report = json.loads(Path('/tmp/online-experiment-store-stress.json').read_text())
          assert report['production_activation'] is False
          assert report['cas_successes'] == 1
          assert report['cas_conflicts'] == report['workers'] - 1
          PY
