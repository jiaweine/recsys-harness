name: Popularity Normalization Performance

on:
  push:
    branches:
      - perf/popularity-norm-hotpath
  pull_request:
    paths:
      - "lingjing_harness/domain.py"
      - "lingjing_harness/algorithms/search.py"
      - "lingjing_harness/algorithms/recommend_core.py"
      - "scripts/popularity_norm_benchmark.py"
      - ".github/workflows/popularity-normalization-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Benchmark popularity normalization
        run: |
          python scripts/popularity_norm_benchmark.py \
            --items 5000 \
            --repeats 5
