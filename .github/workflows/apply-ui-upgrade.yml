name: Apply multimodal workbench upgrade

on:
  push:
    branches: [main]
    paths:
      - ".upgrade/ui/**"
      - ".github/workflows/apply-ui-upgrade.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      LINGJING_DATA_DIR: /tmp/recsys-ui-apply
      RECSYS_CAPTURE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify and unpack source bundle
        run: |
          cat .upgrade/ui/chunk-* > /tmp/recsys-ui-upgrade.b64
          base64 -d /tmp/recsys-ui-upgrade.b64 > /tmp/recsys-ui-upgrade.tar.gz
          echo "c962cacc2a054f125871f4d99ed33116f0fe9c0b6c4d0e14467650a0402b9773  /tmp/recsys-ui-upgrade.tar.gz" | sha256sum -c -
          tar -xzf /tmp/recsys-ui-upgrade.tar.gz
          rm -rf .upgrade/ui

      - name: Install test and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Validate source and product behavior
        run: |
          python -m compileall -q lingjing_harness tests scripts
          node --check frontend/app.js
          pytest -q
          python scripts/demo_smoke.py > /dev/null
          PYTHONPATH=. python -m lingjing_harness.cli '做一次全局体检' > /dev/null

      - name: Start real product
        run: |
          rm -rf "$LINGJING_DATA_DIR"
          python -m uvicorn lingjing_harness.api:app --host 127.0.0.1 --port 8765 > /tmp/recsys-ui.log 2>&1 &
          echo $! > /tmp/recsys-ui.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8765/api/status >/dev/null; then
              exit 0
            fi
            sleep .5
          done
          cat /tmp/recsys-ui.log
          exit 1

      - name: Validate real desktop mobile and multimodal flow
        run: python scripts/capture_readme_assets.py

      - name: Commit clean upgraded source
        run: |
          if [ -f /tmp/recsys-ui.pid ]; then kill "$(cat /tmp/recsys-ui.pid)" || true; fi
          rm -rf .upgrade build dist .pytest_cache
          rm -rf ./*.egg-info lingjing_harness/**/__pycache__ frontend/__pycache__ tests/__pycache__ scripts/__pycache__
          rm -f .github/workflows/apply-ui-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild multimodal autonomous workbench"
          git push
