name: Durable Store Stress
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Exercise durable workspace contention
        run: python scripts/stress_smoke.py --workers 8 --iterations 25 --processes 4
