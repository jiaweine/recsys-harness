name: Durable Store Stress
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contention:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Compile durable store and stress contracts
        run: |
          python -m compileall -q \
            lingjing_harness/store.py \
            lingjing_harness/store_handoff.py \
            lingjing_harness/store_run_schema_migration.py \
            lingjing_harness/rate_limit_maintenance.py \
            scripts/stress_smoke.py \
            tests/test_store.py \
            tests/test_store_fencing_stress.py \
            tests/test_graceful_handoff.py \
            tests/test_rate_limit_maintenance.py \
            tests/test_workspace_run_schema_migration_race.py
      - name: Run deterministic lease, ownership, handoff, clock, and schema fencing contracts
        run: |
          pytest -q \
            tests/test_store.py \
            tests/test_store_fencing_stress.py \
            tests/test_graceful_handoff.py \
            tests/test_rate_limit_maintenance.py \
            tests/test_workspace_run_schema_migration_race.py
      - name: Exercise durable workspace contention at elevated load
        run: python scripts/stress_smoke.py --workers 16 --iterations 80 --processes 8
