name: API Lifecycle Stress
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Exercise API run lifecycle contention
        run: python scripts/api_stress_smoke.py --workers 6 --race 8
