name: Algorithm Quality
on:
  push:
    paths:
      - 'lingjing_harness/algorithms/**'
      - 'lingjing_harness/integrations/**'
      - 'scripts/algorithm_benchmark.py'
      - 'scripts/repo_recommender_benchmark.py'
      - '.github/workflows/algorithm-quality.yml'
  pull_request:
    paths:
      - 'lingjing_harness/algorithms/**'
      - 'lingjing_harness/integrations/**'
      - 'scripts/algorithm_benchmark.py'
      - 'scripts/repo_recommender_benchmark.py'
      - '.github/workflows/algorithm-quality.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Reference engine quality
        run: python scripts/algorithm_benchmark.py
      - name: Install implicit repository release
        run: pip install 'implicit==0.7.3'
      - name: Compare mature collaborative filtering models
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python scripts/repo_recommender_benchmark.py
