name: Algorithm Quality
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Reference engine quality
        run: python scripts/algorithm_benchmark.py
      - name: Install implicit repository release
        run: pip install 'implicit==0.7.3'
      - name: Compare mature collaborative filtering models
        run: python scripts/repo_recommender_benchmark.py
      - name: Install Sentence Transformers repository release
        run: pip install 'sentence-transformers==6.0.0'
      - name: Compare mature multilingual semantic retrieval
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: '120'
        run: python scripts/repo_search_benchmark.py
      - name: Install FlagEmbedding repository release
        run: pip install 'FlagEmbedding==1.4.2'
      - name: Compare Chinese retrieval model
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: '120'
        run: python scripts/repo_search_bge_benchmark.py
