name: Recommend Relevance Seed Graph Performance

on:
  push:
    branches:
      - perf/recommend-relevance-seed-graph-snapshots
  pull_request:
    paths:
      - "lingjing_harness/algorithms/recommend_validation.py"
      - "lingjing_harness/algorithms/recommend_temporal_graph.py"
      - "tests/test_recommend_relevance_seed_graph.py"
      - "tests/test_recommend_temporal_graph_mapping.py"
      - "scripts/recommend_relevance_seed_graph_benchmark.py"
      - "scripts/recommend_relevance_temporal_state_benchmark.py"
      - ".github/workflows/recommend-relevance-seed-graph-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Verify seed temporal graph snapshots
        run: >-
          pytest -q
          tests/test_recommend_relevance_seed_graph.py
          tests/test_recommend_temporal_graph_mapping.py
          tests/test_recommend_relevance_temporal_state.py
      - name: Benchmark seed temporal graph snapshots
        run: |
          for pass in 1 2 3; do
            echo "recommend-relevance-seed-graph pass $pass/3"
            python scripts/recommend_relevance_seed_graph_benchmark.py \
              --items 20000 \
              --background-users 500 \
              --evaluated-users 10 \
              --history 20 \
              --repeats 3 \
              --max-optimized-p50-ms 220 \
              --min-speedup 1.60
          done
