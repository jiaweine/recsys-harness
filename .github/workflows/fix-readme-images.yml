name: Fix README image rendering

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-readme-images.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use stable README image URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          targets = {
              'overview.png': 'Recsys Harness 真实运行界面',
              'workbench.png': 'Recsys Harness 工作台',
              'evidence.png': 'Recsys Harness 证据面板',
              'mobile.png': 'Recsys Harness 移动端',
              'architecture.svg': 'Recsys Harness system architecture',
          }
          for name, alt in targets.items():
              canonical = f'![{alt}](https://raw.githubusercontent.com/jiaweine/recsys-harness/refs/heads/main/docs/readme-assets/{name})'
              candidates = [
                  f'![{alt}](docs/readme-assets/{name})',
                  f'![{alt}](./docs/readme-assets/{name})',
                  f'![{alt}](/docs/readme-assets/{name})',
                  f'![{alt}](https://raw.githubusercontent.com/jiaweine/recsys-harness/main/docs/readme-assets/{name})',
                  f'![{alt}](https://github.com/jiaweine/recsys-harness/blob/main/docs/readme-assets/{name}?raw=1)',
              ]
              for candidate in candidates:
                  text = text.replace(candidate, canonical)
              if canonical not in text:
                  raise SystemExit(f'missing README image reference for {name}')
              asset = Path('docs/readme-assets', name)
              if not asset.is_file() or asset.stat().st_size < 100:
                  raise SystemExit(f'missing or empty README asset: {asset}')
          p.write_text(text if text.endswith('\n') else text + '\n', encoding='utf-8')
          PY
      - name: Verify raw image URLs
        run: |
          for name in overview.png workbench.png evidence.png mobile.png architecture.svg; do
            url="https://raw.githubusercontent.com/jiaweine/recsys-harness/refs/heads/main/docs/readme-assets/$name"
            curl -fsSL -A "Mozilla/5.0 README-render-check" --max-time 20 "$url" -o "/tmp/$name"
            test -s "/tmp/$name"
          done
          python - <<'PY'
          from pathlib import Path
          for name in ('overview.png','workbench.png','evidence.png','mobile.png'):
              data = Path('/tmp', name).read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n'), name
          svg = Path('/tmp/architecture.svg').read_text(encoding='utf-8')
          assert '<svg' in svg
          PY
      - name: Commit README fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Fix README image rendering"
            git push
          else
            echo "README image URLs already stable."
          fi
      - name: Verify rendered repository page
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen
          import time

          REPO = 'https://github.com/jiaweine/recsys-harness'
          EXPECTED = {
              'Recsys Harness 真实运行界面',
              'Recsys Harness 工作台',
              'Recsys Harness 证据面板',
              'Recsys Harness 移动端',
              'Recsys Harness system architecture',
          }
          class Images(HTMLParser):
              def __init__(self):
                  super().__init__(); self.items = {}
              def handle_starttag(self, tag, attrs):
                  if tag != 'img': return
                  attrs = dict(attrs); alt = attrs.get('alt', '')
                  if alt in EXPECTED and attrs.get('src'):
                      self.items[alt] = attrs['src']

          headers = {'User-Agent': 'Mozilla/5.0 README-render-check'}
          last = None
          for attempt in range(12):
              try:
                  with urlopen(Request(REPO, headers=headers), timeout=20) as response:
                      html = response.read().decode('utf-8', 'replace')
                  parser = Images(); parser.feed(html)
                  missing = EXPECTED - parser.items.keys()
                  if missing:
                      raise RuntimeError(f'missing rendered images: {sorted(missing)}')
                  for alt, src in parser.items.items():
                      image_url = urljoin(REPO, src)
                      with urlopen(Request(image_url, headers=headers), timeout=20) as response:
                          ctype = (response.headers.get('Content-Type') or '').lower()
                          body = response.read(32)
                      if not ctype.startswith('image/') or not body:
                          raise RuntimeError(f'broken rendered image: {alt} {ctype} {image_url}')
                  print('Rendered GitHub README images are loadable.')
                  break
              except Exception as exc:
                  last = exc
                  if attempt == 11:
                      raise
                  time.sleep(5)
          else:
              raise last or RuntimeError('render verification failed')
          PY
