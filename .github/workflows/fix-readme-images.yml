name: Fix README image rendering

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-readme-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe candidate image URLs
        run: |
          set +e
          urls=(
            "https://github.com/jiaweine/recsys-harness/raw/refs/heads/main/docs/readme-assets/overview.png"
            "https://github.com/jiaweine/recsys-harness/raw/main/docs/readme-assets/overview.png"
            "https://github.com/jiaweine/recsys-harness/blob/main/docs/readme-assets/overview.png?raw=1"
            "https://raw.githubusercontent.com/jiaweine/recsys-harness/refs/heads/main/docs/readme-assets/overview.png"
            "https://raw.githubusercontent.com/jiaweine/recsys-harness/main/docs/readme-assets/overview.png"
          )
          for url in "${urls[@]}"; do
            echo "PROBE $url"
            curl -L -A "Mozilla/5.0 README-render-check" --max-time 20 -sS -o /tmp/probe.bin -w "HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}\n" "$url"
            python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/probe.bin')
          if p.exists():
              data = p.read_bytes()[:16]
              print('MAGIC=', data.hex())
          PY
          done
          exit 0
