name: Recommend Capability Performance

on:
  pull_request:
    paths:
      - "lingjing_harness/algorithms/recommend_core.py"
      - "tests/test_recommend_capability_hotpath.py"
      - "scripts/recommend_capability_benchmark.py"
      - ".github/workflows/recommend-capability-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Verify bound recommendation capabilities
        run: pytest -q tests/test_recommend_capability_hotpath.py
      - name: Benchmark per-request recommendation capability binding
        run: |
          for pass in 1 2 3; do
            echo "recommend-capability performance pass $pass/3"
            python scripts/recommend_capability_benchmark.py \
              --items 30000 \
              --repeats 7 \
              --limit 8 \
              --max-optimized-recommend-p50-ms 100 \
              --min-prepare-speedup 1.15 \
              --min-recommend-speedup 1.12
          done
