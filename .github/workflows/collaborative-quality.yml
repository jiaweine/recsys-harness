name: Collaborative Quality

on:
  push:
    paths:
      - '.github/workflows/collaborative-quality.yml'
      - 'pyproject.toml'
      - 'lingjing_harness/integrations/**'
      - 'lingjing_harness/runtime/backend_config.py'
      - 'lingjing_harness/runtime/backend_memory.py'
      - 'lingjing_harness/runtime/collaborative_tools.py'
      - 'lingjing_harness/runtime/invocation_maintenance.py'
      - 'lingjing_harness/runtime/skill_retention.py'
      - 'lingjing_harness/runtime/__init__.py'
      - 'lingjing_harness/algorithms/business_replay_budget.py'
      - 'lingjing_harness/algorithms/evolution.py'
      - 'lingjing_harness/algorithms/production_evolution.py'
      - 'lingjing_harness/algorithms/recommend_validation.py'
      - 'lingjing_harness/algorithms/segment_credit.py'
      - 'lingjing_harness/algorithms/segment_evolution.py'
      - 'scripts/collaborative_backend_smoke.py'
      - 'tests/test_backend_scoped_memory_stats.py'
      - 'tests/test_invocation_maintenance.py'
      - 'tests/test_skill_retention.py'
      - 'tests/test_runtime_backend_config.py'
      - 'tests/test_runtime_model_reuse.py'
      - 'tests/test_business_replay_budget.py'
      - 'tests/test_collaborative_runtime.py'
      - 'tests/test_implicit_hybrid_runtime.py'
      - 'tests/test_implicit_recommendation.py'
      - 'tests/test_optional_integrations.py'
      - 'tests/test_segment_portfolio.py'
  pull_request:
    paths:
      - '.github/workflows/collaborative-quality.yml'
      - 'pyproject.toml'
      - 'lingjing_harness/integrations/**'
      - 'lingjing_harness/runtime/backend_config.py'
      - 'lingjing_harness/runtime/backend_memory.py'
      - 'lingjing_harness/runtime/collaborative_tools.py'
      - 'lingjing_harness/runtime/invocation_maintenance.py'
      - 'lingjing_harness/runtime/skill_retention.py'
      - 'lingjing_harness/runtime/__init__.py'
      - 'lingjing_harness/algorithms/business_replay_budget.py'
      - 'lingjing_harness/algorithms/evolution.py'
      - 'lingjing_harness/algorithms/production_evolution.py'
      - 'lingjing_harness/algorithms/recommend_validation.py'
      - 'lingjing_harness/algorithms/segment_credit.py'
      - 'lingjing_harness/algorithms/segment_evolution.py'
      - 'scripts/collaborative_backend_smoke.py'
      - 'tests/test_backend_scoped_memory_stats.py'
      - 'tests/test_invocation_maintenance.py'
      - 'tests/test_skill_retention.py'
      - 'tests/test_runtime_backend_config.py'
      - 'tests/test_runtime_model_reuse.py'
      - 'tests/test_business_replay_budget.py'
      - 'tests/test_collaborative_runtime.py'
      - 'tests/test_implicit_hybrid_runtime.py'
      - 'tests/test_implicit_recommendation.py'
      - 'tests/test_optional_integrations.py'
      - 'tests/test_segment_portfolio.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  implicit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Install official implicit release
        run: pip install 'implicit==0.7.3'
      - name: Exercise mature models, hybrid runtime, evolution and fallback routing
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: >-
          pytest -q
          tests/test_backend_scoped_memory_stats.py
          tests/test_invocation_maintenance.py
          tests/test_skill_retention.py
          tests/test_runtime_backend_config.py
          tests/test_runtime_model_reuse.py
          tests/test_business_replay_budget.py
          tests/test_collaborative_runtime.py
          tests/test_implicit_hybrid_runtime.py
          tests/test_implicit_recommendation.py
          tests/test_optional_integrations.py
          tests/test_segment_portfolio.py
      - name: Exercise public AgentHarness with official implicit ALS
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python scripts/collaborative_backend_smoke.py
