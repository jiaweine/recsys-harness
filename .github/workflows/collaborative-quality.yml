name: Collaborative Quality

on:
  push:
    paths:
      - '.github/workflows/collaborative-quality.yml'
      - 'pyproject.toml'
      - 'lingjing_harness/integrations/**'
      - 'tests/test_implicit_recommendation.py'
      - 'tests/test_optional_integrations.py'
  pull_request:
    paths:
      - '.github/workflows/collaborative-quality.yml'
      - 'pyproject.toml'
      - 'lingjing_harness/integrations/**'
      - 'tests/test_implicit_recommendation.py'
      - 'tests/test_optional_integrations.py'
  workflow_dispatch:

jobs:
  implicit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Install official implicit release
        run: pip install 'implicit==0.7.3'
      - name: Exercise mature models, fallback routing and lazy loading
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: pytest -q tests/test_implicit_recommendation.py tests/test_optional_integrations.py
