name: Optimizer Meta Quality

on:
  push:
    paths:
      - '.github/workflows/optimizer-meta-quality.yml'
      - 'lingjing_harness/algorithms/optimizer_meta.py'
      - 'lingjing_harness/algorithms/optimizer_observations.py'
      - 'lingjing_harness/algorithms/optimizer_observation_weighting.py'
      - 'lingjing_harness/runtime/__init__.py'
      - 'lingjing_harness/runtime/backend_config.py'
      - 'lingjing_harness/runtime/backend_memory.py'
      - 'lingjing_harness/runtime/optimizer_meta_memory.py'
      - 'lingjing_harness/runtime/optimizer_observation_drift.py'
      - 'lingjing_harness/runtime/optimizer_observation_drift_confidence.py'
      - 'lingjing_harness/runtime/optimizer_observation_memory.py'
      - 'lingjing_harness/runtime/optimizer_observation_weighting.py'
      - 'lingjing_harness/runtime/optimizer_routing_checkpoint.py'
      - 'lingjing_harness/runtime/optimizer_routing_epoch.py'
      - 'lingjing_harness/runtime/optimizer_tools.py'
      - 'scripts/optimizer_drift_calibration.py'
      - 'scripts/optimizer_meta_benchmark.py'
      - 'tests/test_optimizer_drift_calibration.py'
      - 'tests/test_optimizer_landscape_descriptors.py'
      - 'tests/test_optimizer_observation_drift.py'
      - 'tests/test_optimizer_observation_drift_recency.py'
      - 'tests/test_optimizer_observation_drift_surfaces.py'
      - 'tests/test_optimizer_observation_feasibility_history.py'
      - 'tests/test_optimizer_routing_epoch.py'
      - 'tests/test_optimizer_observation_weighting.py'
      - 'tests/test_optimizer_meta_router.py'
      - 'tests/test_optimizer_meta_memory.py'
      - 'tests/test_optimizer_meta_registry.py'
      - 'tests/test_optimizer_meta_backend_scope.py'
      - 'tests/test_optimizer_meta_benchmark.py'
      - 'tests/test_optimizer_backends.py'
      - 'pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/optimizer-meta-quality.yml'
      - 'lingjing_harness/algorithms/optimizer_meta.py'
      - 'lingjing_harness/algorithms/optimizer_observations.py'
      - 'lingjing_harness/algorithms/optimizer_observation_weighting.py'
      - 'lingjing_harness/runtime/__init__.py'
      - 'lingjing_harness/runtime/backend_config.py'
      - 'lingjing_harness/runtime/backend_memory.py'
      - 'lingjing_harness/runtime/optimizer_meta_memory.py'
      - 'lingjing_harness/runtime/optimizer_observation_drift.py'
      - 'lingjing_harness/runtime/optimizer_observation_drift_confidence.py'
      - 'lingjing_harness/runtime/optimizer_observation_memory.py'
      - 'lingjing_harness/runtime/optimizer_observation_weighting.py'
      - 'lingjing_harness/runtime/optimizer_routing_checkpoint.py'
      - 'lingjing_harness/runtime/optimizer_routing_epoch.py'
      - 'lingjing_harness/runtime/optimizer_tools.py'
      - 'scripts/optimizer_drift_calibration.py'
      - 'scripts/optimizer_meta_benchmark.py'
      - 'tests/test_optimizer_drift_calibration.py'
      - 'tests/test_optimizer_landscape_descriptors.py'
      - 'tests/test_optimizer_observation_drift.py'
      - 'tests/test_optimizer_observation_drift_recency.py'
      - 'tests/test_optimizer_observation_drift_surfaces.py'
      - 'tests/test_optimizer_observation_feasibility_history.py'
      - 'tests/test_optimizer_routing_epoch.py'
      - 'tests/test_optimizer_observation_weighting.py'
      - 'tests/test_optimizer_meta_router.py'
      - 'tests/test_optimizer_meta_memory.py'
      - 'tests/test_optimizer_meta_registry.py'
      - 'tests/test_optimizer_meta_backend_scope.py'
      - 'tests/test_optimizer_meta_benchmark.py'
      - 'tests/test_optimizer_backends.py'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Compile meta-router runtime
        run: |
          python -m compileall -q \
            lingjing_harness/algorithms/optimizer_meta.py \
            lingjing_harness/algorithms/optimizer_observations.py \
            lingjing_harness/algorithms/optimizer_observation_weighting.py \
            lingjing_harness/runtime/__init__.py \
            lingjing_harness/runtime/backend_config.py \
            lingjing_harness/runtime/optimizer_meta_memory.py \
            lingjing_harness/runtime/optimizer_observation_drift.py \
            lingjing_harness/runtime/optimizer_observation_drift_confidence.py \
            lingjing_harness/runtime/optimizer_observation_memory.py \
            lingjing_harness/runtime/optimizer_observation_weighting.py \
            lingjing_harness/runtime/optimizer_routing_checkpoint.py \
            lingjing_harness/runtime/optimizer_routing_epoch.py \
            lingjing_harness/runtime/optimizer_tools.py \
            scripts/optimizer_drift_calibration.py \
            scripts/optimizer_meta_benchmark.py \
            tests/test_optimizer_drift_calibration.py \
            tests/test_optimizer_landscape_descriptors.py \
            tests/test_optimizer_observation_drift.py \
            tests/test_optimizer_observation_drift_recency.py \
            tests/test_optimizer_observation_drift_surfaces.py \
            tests/test_optimizer_observation_feasibility_history.py \
            tests/test_optimizer_routing_epoch.py \
            tests/test_optimizer_observation_weighting.py \
            tests/test_optimizer_meta_router.py \
            tests/test_optimizer_meta_memory.py \
            tests/test_optimizer_meta_registry.py \
            tests/test_optimizer_meta_backend_scope.py \
            tests/test_optimizer_meta_benchmark.py
      - name: Run dependency-light routing, ledger, registry, and backend-scope contracts
        run: |
          pytest -q \
            tests/test_optimizer_drift_calibration.py \
            tests/test_optimizer_landscape_descriptors.py \
            tests/test_optimizer_observation_drift.py \
            tests/test_optimizer_observation_drift_recency.py \
            tests/test_optimizer_observation_drift_surfaces.py \
            tests/test_optimizer_observation_feasibility_history.py \
            tests/test_optimizer_routing_epoch.py \
            tests/test_optimizer_observation_weighting.py \
            tests/test_optimizer_meta_router.py \
            tests/test_optimizer_meta_memory.py \
            tests/test_optimizer_meta_registry.py \
            tests/test_optimizer_meta_backend_scope.py \
            tests/test_optimizer_meta_benchmark.py \
            tests/test_optimizer_backends.py
      - name: Run deterministic drift calibration
        run: python scripts/optimizer_drift_calibration.py --seeds 128
      - name: Verify default remains native and auto exposes no activation authority
        run: |
          python - <<'PY'
          from lingjing_harness.runtime.optimizer_tools import OptimizerToolRegistry
          from lingjing_harness.sample_data import build_sample_catalog

          default = OptimizerToolRegistry(build_sample_catalog())
          auto = OptimizerToolRegistry(build_sample_catalog(), optimizer_backend='auto')
          assert default.optimizer_backend == 'native'
          assert auto.optimizer_backend == 'auto'
          manifest = auto.inspect_data()['optimizer_meta_router']
          assert manifest['authority'] == 'optimizer_selection_only'
          assert manifest['default_backend'] == 'native'
          assert manifest['landscape_descriptors'] == 'durable_evaluator_observations_with_strategy_fallback'
          assert manifest['optimizer_observation_memory'] == 'evaluator_paid_discovery_rows_only'
          assert manifest['optimizer_observation_history'] == 'bounded_same_config_evaluator_history'
          assert manifest['optimizer_observation_history_retention'] == 192
          assert manifest['optimizer_observation_authority'] == 'routing_descriptor_only'
          assert manifest['optimizer_observation_weighting'] == 'recency_half_life_and_log_evidence'
          assert manifest['optimizer_observation_confidence'] == 'effective_fresh_rows_and_weight_concentration'
          assert manifest['optimizer_observation_effective_rows_method'] == 'min_kish_ess_and_total_routing_weight'
          assert manifest['optimizer_observation_confidence_fallback'] == 'pre_observation_router'
          assert manifest['optimizer_observation_hysteresis'] == 'per_registry_routing_regime'
          assert manifest['optimizer_observation_exit_min_effective_rows'] == 3.5
          assert manifest['optimizer_observation_exit_max_weight_share'] == 0.55
          assert manifest['optimizer_observation_drift_detection'] == 'temporal_change_point_local_geometry'
          assert manifest['optimizer_observation_drift_min_window_rows'] == 4
          assert manifest['optimizer_observation_drift_max_window_rows'] == 24
          assert manifest['optimizer_observation_drift_primary_signals'] == 'local_order_or_contrast'
          assert manifest['optimizer_observation_drift_feasibility_role'] == 'supporting_only_without_same_config_history'
          assert manifest['optimizer_observation_drift_same_config_feasibility'] == 'primary_with_basis_matched_history'
          assert manifest['optimizer_observation_drift_same_config_min_pairs'] == 4
          assert manifest['optimizer_observation_drift_action'] == 'recent_only_if_entry_confident_else_pre_observation_fallback'
          assert manifest['optimizer_observation_drift_authority'] == 'routing_descriptor_only'
          assert manifest['optimizer_observation_drift_evaluator_calls'] == 0
          assert manifest['optimizer_observation_drift_window_scope'] == 'candidate_boundary_local'
          assert manifest['optimizer_observation_drift_local_window_rows'] == 4
          assert manifest['optimizer_observation_drift_contrast_confidence'] == 'leave_one_match_out_unanimous'
          assert manifest['optimizer_observation_drift_contrast_confidence_authority'] == 'routing_descriptor_only'
          assert manifest['optimizer_observation_drift_contrast_confidence_evaluator_calls'] == 0
          assert manifest['optimizer_observation_regime_checkpoint'] == 'optimizer_meta_memory_evidence_fenced_ttl'
          assert manifest['optimizer_observation_regime_checkpoint_ttl_seconds'] == 259200.0
          assert manifest['optimizer_observation_regime_checkpoint_refresh_seconds'] == 129600.0
          assert manifest['optimizer_observation_regime_checkpoint_authority'] == 'routing_hysteresis_only'
          assert manifest['optimizer_observation_regime_checkpoint_evaluator_calls'] == 0
          assert manifest['optimizer_observation_routing_epoch'] == 'durable_checkpoint_change_point_fence'
          assert manifest['optimizer_observation_routing_epoch_boundary'] == 'confirmed_recent_oldest_at'
          assert manifest['optimizer_observation_routing_epoch_authority'] == 'routing_descriptor_only'
          assert manifest['optimizer_observation_routing_epoch_evaluator_calls'] == 0
          assert manifest['optimizer_observation_weighting_authority'] == 'routing_descriptor_only'
          assert manifest['landscape_descriptor_evaluator_calls'] == 0
          assert manifest['optimizer_observation_weighting_evaluator_calls'] == 0
          PY

  optional-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: Install pinned optional optimizer stack
        run: pip install 'optuna==4.9.0' 'botorch==0.18.1'
      - name: Verify optional stack versions and meta preflight
        run: |
          python - <<'PY'
          import botorch
          import optuna
          from lingjing_harness.runtime.optimizer_tools import OptimizerToolRegistry
          from lingjing_harness.sample_data import build_sample_catalog

          assert botorch.__version__ == '0.18.1'
          assert optuna.__version__ == '4.9.0'
          registry = OptimizerToolRegistry(build_sample_catalog(), optimizer_backend='auto')
          selected, decision, failures = registry._select_auto_backend('search')
          assert selected in {'native', 'optuna', 'optuna_motpe', 'qlognehvi'}
          assert decision.context.evaluation_budget > 0
          assert decision.context.landscape.to_dict()['new_evaluator_calls'] == 0
          assert failures == {}
          assert decision.to_dict()['authority'] == 'optimizer_selection_only'
          PY
