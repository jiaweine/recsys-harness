<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">Recsys Harness autonomous multimodal system map</title>
<desc id="desc">Detailed system map showing multimodal input, owned autonomous control, permissioned network evidence, tool execution, self-evolution, memory, trust and durability planes.</desc>
<style>
  .bg{fill:#f5f1e8}.ink{fill:#172019}.night{fill:#14231e}.paper{fill:#fffdf7}.paper2{fill:#eae5da}.signal{fill:#d9ff59}.hot{fill:#f36b4b}.line{stroke:#a9ad9f;stroke-width:1.3}.strong{stroke:#172019;stroke-width:1.8}.dash{stroke:#7b8279;stroke-width:1.2;stroke-dasharray:7 7}.t{font-family:"Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172019}.white{fill:#f7f4eb}.cap{font-size:13px;font-weight:700;letter-spacing:2.2px}.h1{font-family:Georgia,"Times New Roman",serif;font-size:34px;font-weight:700}.h2{font-size:18px;font-weight:750}.body{font-size:13px}.small{font-size:11px;fill:#5e675f}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px}.node{fill:#fffdf7;stroke:#a9ad9f;stroke-width:1.2}.nodeStrong{fill:#fffdf7;stroke:#172019;stroke-width:1.6}.tag{fill:#e5e0d4}.arrow{fill:none;stroke:#172019;stroke-width:1.5;marker-end:url(#arrow)}.arrowSoft{fill:none;stroke:#6f786f;stroke-width:1.2;marker-end:url(#arrowSoft)}
</style>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#172019"/></marker>
  <marker id="arrowSoft" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6f786f"/></marker>
</defs>
<rect class="bg" width="1600" height="1040"/>
<rect class="night" x="0" y="0" width="1600" height="114"/>
<text class="t white cap" x="54" y="42">SYSTEM MAP / AUTONOMOUS EXPERIENCE HARNESS</text>
<text class="t white h1" x="54" y="82">Evidence moves forward. Permission never does.</text>
<text class="t white body" x="1124" y="47">MULTIMODAL · NETWORK · MEMORY</text>
<text class="t white body" x="1124" y="72">EVOLUTION · RECOVERY · OWNED CONTROL</text>

<!-- left input plane -->
<text class="t cap" x="54" y="154">01 · EXPERIENCE INPUT</text>
<rect class="nodeStrong" x="54" y="178" width="292" height="194" rx="2"/>
<rect class="signal" x="54" y="178" width="8" height="194"/>
<text class="t h2" x="82" y="215">Goal + multimodal context</text>
<text class="t body" x="82" y="247">Natural-language objective</text>
<text class="t body" x="82" y="273">Screenshot / pasted image</text>
<text class="t body" x="82" y="299">JSON · CSV · Markdown · TXT</text>
<text class="t body" x="82" y="325">Per-run network permission</text>
<text class="t small" x="82" y="353">Attachments are observations, never permissions.</text>

<rect class="node" x="54" y="394" width="292" height="126" rx="2"/>
<text class="t h2" x="82" y="430">Perception boundary</text>
<text class="t body" x="82" y="458">Local text parsing</text>
<text class="t body" x="82" y="484">Optional image perception service</text>
<text class="t small" x="82" y="506">No tool choice · no strategy promotion</text>

<!-- central control -->
<text class="t cap" x="398" y="154">02 · OWNED AUTONOMOUS CONTROL</text>
<rect class="nodeStrong" x="398" y="178" width="566" height="342" rx="2"/>
<text class="t h2" x="426" y="215">Evidence-utility controller</text>
<text class="t small" x="426" y="239">Every cycle recomputes the next action from current state.</text>

<rect class="paper2" x="426" y="266" width="150" height="78" rx="2"/>
<text class="t cap" x="445" y="291">OBSERVE</text>
<text class="t small" x="445" y="317">data · memory</text>
<text class="t small" x="445" y="334">attachments · evidence</text>

<rect class="signal" x="592" y="266" width="150" height="78" rx="2"/>
<text class="t cap" x="611" y="291">DECIDE</text>
<text class="t small" x="611" y="317">evidence gap</text>
<text class="t small" x="611" y="334">information gain · cost</text>

<rect class="paper2" x="758" y="266" width="150" height="78" rx="2"/>
<text class="t cap" x="777" y="291">ACT</text>
<text class="t small" x="777" y="317">tool risk guard</text>
<text class="t small" x="777" y="334">real handler</text>

<path class="arrow" d="M576 305 H592"/><path class="arrow" d="M742 305 H758"/>
<path class="arrowSoft" d="M833 344 C833 380 505 380 505 344"/>
<text class="t small" x="618" y="376">observation changes the next decision</text>

<rect class="node" x="426" y="402" width="226" height="88" rx="2"/>
<text class="t h2" x="445" y="431">Hard boundaries</text>
<text class="t small" x="445" y="454">time · tool count · cost</text>
<text class="t small" x="445" y="473">adaptation · network permission</text>

<rect class="node" x="670" y="402" width="238" height="88" rx="2"/>
<text class="t h2" x="689" y="431">Decision provenance</text>
<text class="t small" x="689" y="454">chosen action · alternatives</text>
<text class="t small" x="689" y="473">learned utility · cycle trace</text>

<!-- right evidence -->
<text class="t cap" x="1016" y="154">03 · EXTERNAL EVIDENCE</text>
<rect class="nodeStrong" x="1016" y="178" width="530" height="158" rx="2"/>
<rect class="hot" x="1016" y="178" width="8" height="158"/>
<text class="t h2" x="1044" y="215">Permissioned network research</text>
<text class="t body" x="1044" y="247">Only appears when configured + allowed for this run.</text>
<text class="t body" x="1044" y="274">Returns title · URL · snippet as attributable evidence.</text>
<text class="t small" x="1044" y="307">Network content never enters strategy-promotion samples.</text>

<rect class="node" x="1016" y="358" width="530" height="162" rx="2"/>
<text class="t h2" x="1044" y="395">Evidence ledger</text>
<text class="t body" x="1044" y="426">Result evidence</text>
<text class="t body" x="1044" y="451">Diagnostic evidence</text>
<text class="t body" x="1044" y="476">External evidence with source URL</text>
<text class="t small" x="1044" y="502">The verifier sees provenance, not just prose.</text>

<path class="arrow" d="M346 274 H398"/><path class="arrowSoft" d="M346 457 H398"/>
<path class="arrowSoft" d="M964 246 H1016"/><path class="arrow" d="M1016 431 H964"/>

<!-- tool plane -->
<text class="t cap" x="54" y="576">04 · TOOL PLANE</text>
<rect class="nodeStrong" x="54" y="600" width="910" height="154" rx="2"/>
<text class="t h2" x="82" y="636">Real capabilities with explicit risk contracts</text>
<g>
<rect class="tag" x="82" y="660" width="132" height="52" rx="2"/><text class="t mono" x="96" y="681">data.inspect</text><text class="t small" x="96" y="700">read</text>
<rect class="tag" x="226" y="660" width="132" height="52" rx="2"/><text class="t mono" x="240" y="681">search.*</text><text class="t small" x="240" y="700">read · simulation</text>
<rect class="tag" x="370" y="660" width="132" height="52" rx="2"/><text class="t mono" x="384" y="681">recommend.*</text><text class="t small" x="384" y="700">read · simulation</text>
<rect class="signal" x="514" y="660" width="132" height="52" rx="2"/><text class="t mono" x="528" y="681">*.evolve</text><text class="t small" x="528" y="700">adaptive</text>
<rect class="tag" x="658" y="660" width="132" height="52" rx="2"/><text class="t mono" x="672" y="681">web.research</text><text class="t small" x="672" y="700">network</text>
<rect class="tag" x="802" y="660" width="132" height="52" rx="2"/><text class="t mono" x="816" y="681">checkpoint</text><text class="t small" x="816" y="700">durability</text>
</g>
<path class="arrow" d="M681 520 V600"/>

<!-- evolution / memory / trust -->
<text class="t cap" x="1016" y="576">05 · EVOLUTION + TRUST</text>
<rect class="nodeStrong" x="1016" y="600" width="530" height="318" rx="2"/>
<text class="t h2" x="1044" y="636">Eval-gated self-evolution</text>
<text class="t small" x="1044" y="660">No arbitrary source-code mutation.</text>

<rect class="paper2" x="1044" y="684" width="214" height="82" rx="2"/>
<text class="t cap" x="1063" y="710">DISCOVERY</text>
<text class="t small" x="1063" y="735">multi-candidate search</text>
<text class="t small" x="1063" y="753">elite mutation</text>
<rect class="paper2" x="1274" y="684" width="242" height="82" rx="2"/>
<text class="t cap" x="1293" y="710">HOLDOUT</text>
<text class="t small" x="1293" y="735">unseen validation</text>
<text class="t small" x="1293" y="753">robustness gates</text>
<path class="arrow" d="M1258 725 H1274"/>

<rect class="signal" x="1044" y="784" width="214" height="98" rx="2"/>
<text class="t cap" x="1063" y="810">PROMOTE</text>
<text class="t small" x="1063" y="835">trusted strategy memory</text>
<text class="t small" x="1063" y="855">activate only if allowed</text>
<rect class="paper2" x="1274" y="784" width="242" height="98" rx="2"/>
<text class="t cap" x="1293" y="810">DRIFT / ROLLBACK</text>
<text class="t small" x="1293" y="835">future validation</text>
<text class="t small" x="1293" y="855">retire on regression</text>
<path class="arrow" d="M1395 766 V784"/><path class="arrowSoft" d="M1274 833 H1258"/>

<text class="t cap" x="54" y="810">06 · MEMORY + DURABILITY</text>
<rect class="nodeStrong" x="54" y="834" width="910" height="160" rx="2"/>
<rect class="node" x="82" y="866" width="190" height="92" rx="2"/><text class="t h2" x="100" y="896">Episodic</text><text class="t small" x="100" y="921">goal · actions · reward</text><text class="t small" x="100" y="941">bounded recall + forgetting</text>
<rect class="node" x="290" y="866" width="190" height="92" rx="2"/><text class="t h2" x="308" y="896">Procedural</text><text class="t small" x="308" y="921">trusted · active · retired</text><text class="t small" x="308" y="941">strategy fingerprints</text>
<rect class="node" x="498" y="866" width="190" height="92" rx="2"/><text class="t h2" x="516" y="896">Policy utility</text><text class="t small" x="516" y="921">action trials · reward</text><text class="t small" x="516" y="941">bounded learned bonus</text>
<rect class="node" x="706" y="866" width="230" height="92" rx="2"/><text class="t h2" x="724" y="896">Durable run state</text><text class="t small" x="724" y="921">checkpoint · rehydrate</text><text class="t small" x="724" y="941">idempotent adaptive replay</text>
<path class="arrowSoft" d="M510 754 V834"/>
<path class="arrowSoft" d="M964 898 H1016"/>

<text class="t small" x="54" y="1022">Owned ranking core remains the source of search/recommend execution and evaluation. Optional perception and network services provide observations, never control.</text>
</svg>
