<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">Recsys Harness autonomous system map</title>
  <desc id="desc">Detailed architecture showing autonomous control, tools, evaluation-gated evolution, memory, trust, durability, data and owned search and recommendation algorithms.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#223227" stroke-width="1" opacity=".38"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#C8F06A"/></marker>
    <style>
      .s{font-family:Arial,'Noto Sans SC',sans-serif}.m{font-family:'SFMono-Regular',Consolas,monospace}.white{fill:#F8FAF4}.ink{fill:#142219}.muted{fill:#93A096}.dim{fill:#5E6D63}.accent{fill:#C8F06A}.k{font-size:13px;letter-spacing:2px;font-weight:700}.h1{font-size:31px;font-weight:700}.h2{font-size:19px;font-weight:700}.b{font-size:14px}.sm{font-size:12px}.xs{font-size:10px;letter-spacing:1px}.flow{stroke:#C8F06A;stroke-width:2;fill:none;marker-end:url(#arrow)}.link{stroke:#607066;stroke-width:1.3;fill:none}.dark{fill:#15241A;stroke:#3A4D40}.paper{fill:#F1EFE7}.soft{fill:#E3E4DC}.lime{fill:#D9E8BE}.panel{fill:#17271C;stroke:#3A4D40}
    </style>
  </defs>
  <rect width="1600" height="1020" fill="#0E1711"/><rect width="1600" height="1020" fill="url(#grid)"/>
  <text x="62" y="52" class="s k accent">AUTONOMOUS SYSTEM MAP / SEARCH + RECOMMENDATION</text>
  <text x="62" y="91" class="s h1 white">Decide → act → verify → learn → recover, inside explicit safety boundaries.</text>
  <text x="62" y="118" class="s b muted">The ranking core stays owned. The harness controls autonomy, evolution, memory, trust and durability.</text>

  <!-- experience -->
  <rect x="62" y="158" width="310" height="210" rx="5" class="dark"/>
  <text x="84" y="186" class="s xs accent">01 / EXPERIENCE</text><text x="84" y="218" class="s h2 white">Business goal in.</text>
  <text x="84" y="246" class="s b muted">搜索体验 · 推荐体验 · 方案复核</text><text x="84" y="269" class="s b muted">全局体检 · 执行记录 · 判断依据</text>
  <line x1="84" y1="290" x2="348" y2="290" stroke="#405247"/>
  <text x="84" y="318" class="m sm accent">GOAL</text><text x="140" y="318" class="s sm white">自然语言目标</text>
  <text x="84" y="342" class="m sm accent">GUARD</text><text x="140" y="342" class="s sm white">显式“不改变 / 允许调整”</text>

  <!-- control -->
  <rect x="408" y="158" width="700" height="210" rx="5" class="paper"/>
  <text x="432" y="186" class="s xs ink">02 / AUTONOMOUS CONTROL PLANE</text><text x="432" y="217" class="s h2 ink">Dynamic replan, not a fixed workflow.</text>
  <g transform="translate(432 244)"><rect width="116" height="82" rx="4" class="soft"/><text x="13" y="23" class="m xs ink">OBSERVE</text><text x="13" y="47" class="s sm dim">state + evidence</text><text x="13" y="65" class="s sm dim">memory recall</text></g>
  <g transform="translate(560 244)"><rect width="116" height="82" rx="4" class="lime"/><text x="13" y="23" class="m xs ink">DECIDE</text><text x="13" y="47" class="s sm dim">score actions</text><text x="13" y="65" class="s sm dim">learned utility</text></g>
  <g transform="translate(688 244)"><rect width="116" height="82" rx="4" class="soft"/><text x="13" y="23" class="m xs ink">ACT</text><text x="13" y="47" class="s sm dim">real handler</text><text x="13" y="65" class="s sm dim">cost + risk</text></g>
  <g transform="translate(816 244)"><rect width="116" height="82" rx="4" class="soft"/><text x="13" y="23" class="m xs ink">REPLAN</text><text x="13" y="47" class="s sm dim">new observation</text><text x="13" y="65" class="s sm dim">change path</text></g>
  <g transform="translate(944 244)"><rect width="140" height="82" rx="4" class="soft"/><text x="13" y="23" class="m xs ink">COMPLETE</text><text x="13" y="47" class="s sm dim">global verify</text><text x="13" y="65" class="s sm dim">reward + learn</text></g>
  <path d="M548 285H558M676 285H686M804 285H814M932 285H942" class="flow"/>
  <path d="M1000 337C1000 352 625 352 625 333" class="link"/><text x="706" y="352" class="s xs dim">loop until evidence / budget / guard says stop</text>

  <!-- trust -->
  <rect x="1144" y="158" width="394" height="210" rx="5" class="panel"/>
  <text x="1168" y="186" class="s xs accent">03 / TRUST &amp; PERMISSIONS</text><text x="1168" y="218" class="s h2 white">Autonomy with hard gates.</text>
  <text x="1168" y="250" class="m sm accent">READ</text><text x="1230" y="250" class="s sm white">reproduce / inspect / diagnose</text>
  <text x="1168" y="276" class="m sm accent">SIM</text><text x="1230" y="276" class="s sm white">offline audit / counterfactual</text>
  <text x="1168" y="302" class="m sm accent">ADAPT</text><text x="1230" y="302" class="s sm white">learn internally; activation gated</text>
  <line x1="1168" y1="319" x2="1510" y2="319" stroke="#405247"/>
  <text x="1168" y="343" class="s xs muted">RESULT VERIFIER · USER CONSTRAINT · BUDGET · ROLLBACK</text>

  <!-- tools -->
  <rect x="62" y="410" width="370" height="288" rx="5" class="paper"/>
  <text x="84" y="438" class="s xs ink">04 / TOOL PLANE</text><text x="84" y="470" class="s h2 ink">Typed capability contracts</text>
  <text x="84" y="496" class="s sm dim">risk · cost · side_effect · schema · repeatability</text>
  <line x1="84" y1="515" x2="408" y2="515" stroke="#C6CBC4"/>
  <text x="84" y="542" class="m sm ink">data.inspect</text><text x="248" y="542" class="s sm dim">workspace + memory</text>
  <text x="84" y="570" class="m sm ink">search.run</text><text x="248" y="570" class="s sm dim">real ranking</text>
  <text x="84" y="598" class="m sm ink">search.diagnose</text><text x="248" y="598" class="s sm dim">failure evidence</text>
  <text x="84" y="626" class="m sm ink">search.audit / evolve</text><text x="248" y="626" class="s sm dim">eval + learning</text>
  <text x="84" y="654" class="m sm ink">recommend.*</text><text x="248" y="654" class="s sm dim">run / diagnose / audit / evolve</text>
  <text x="84" y="681" class="s xs dim">CAPABILITY MANIFEST AVAILABLE THROUGH /api/capabilities</text>

  <!-- evolution -->
  <rect x="468" y="410" width="640" height="288" rx="5" class="dark"/>
  <text x="492" y="438" class="s xs accent">05 / EVOLUTION LAB</text><text x="492" y="470" class="s h2 white">Eval-gated self-evolution</text>
  <g transform="translate(492 503)"><rect width="132" height="70" rx="4" fill="#203126"/><text x="13" y="22" class="m xs accent">GENERATE</text><text x="13" y="45" class="s sm white">targeted + memory</text><text x="13" y="61" class="s sm muted">+ perturbation</text></g>
  <g transform="translate(636 503)"><rect width="132" height="70" rx="4" fill="#203126"/><text x="13" y="22" class="m xs accent">DISCOVERY</text><text x="13" y="45" class="s sm white">candidate race</text><text x="13" y="61" class="s sm muted">elite mutation</text></g>
  <g transform="translate(780 503)"><rect width="132" height="70" rx="4" fill="#203126"/><text x="13" y="22" class="m xs accent">HOLDOUT</text><text x="13" y="45" class="s sm white">unseen samples</text><text x="13" y="61" class="s sm muted">generalization</text></g>
  <g transform="translate(924 503)"><rect width="160" height="70" rx="4" fill="#203126"/><text x="13" y="22" class="m xs accent">REGRESSION</text><text x="13" y="45" class="s sm white">full evidence</text><text x="13" y="61" class="s sm muted">worst-case gate</text></g>
  <path d="M624 538H634M768 538H778M912 538H922" class="flow"/>
  <rect x="492" y="600" width="592" height="66" rx="4" fill="#D9E8BE"/>
  <text x="510" y="624" class="m xs ink">PROMOTE</text><text x="585" y="624" class="s sm ink">safe + stable advantage → trusted skill</text>
  <text x="510" y="648" class="m xs ink">ACTIVATE</text><text x="585" y="648" class="s sm ink">only with explicit permission · future drift can rollback</text>

  <!-- memory -->
  <rect x="1144" y="410" width="394" height="288" rx="5" class="paper"/>
  <text x="1168" y="438" class="s xs ink">06 / MEMORY PLANE</text><text x="1168" y="470" class="s h2 ink">Learn and forget.</text>
  <text x="1168" y="511" class="m sm ink">EPISODIC</text><text x="1270" y="511" class="s sm dim">goal · trace · reward</text>
  <text x="1168" y="545" class="m sm ink">PROCEDURAL</text><text x="1270" y="545" class="s sm dim">trusted / active skill</text>
  <text x="1168" y="579" class="m sm ink">POLICY</text><text x="1270" y="579" class="s sm dim">action utility</text>
  <line x1="1168" y1="600" x2="1510" y2="600" stroke="#C6CBC4"/>
  <text x="1168" y="625" class="s sm dim">Recent + high-value retention</text><text x="1168" y="648" class="s sm dim">Skill capacity · retire stale experience</text>
  <text x="1168" y="675" class="s xs dim">CATALOG FINGERPRINT PREVENTS STALE CROSS-DATA REUSE</text>

  <!-- durability -->
  <rect x="62" y="742" width="470" height="220" rx="5" class="panel"/>
  <text x="84" y="770" class="s xs accent">07 / DURABILITY</text><text x="84" y="802" class="s h2 white">Crash-safe autonomous runs</text>
  <text x="84" y="836" class="m sm accent">CHECKPOINT</text><text x="186" y="836" class="s sm white">state · evidence · decisions · cost</text>
  <text x="84" y="866" class="m sm accent">REHYDRATE</text><text x="186" y="866" class="s sm white">continue after completed actions</text>
  <text x="84" y="896" class="m sm accent">IDEMPOTENCY</text><text x="186" y="896" class="s sm white">adaptive invocation result replay</text>
  <text x="84" y="930" class="s xs muted">SQLITE RUN STORE · RECOVERABLE JOBS · NO DUPLICATE LEARNING</text>

  <!-- owned core -->
  <rect x="568" y="742" width="970" height="220" rx="5" class="paper"/>
  <text x="592" y="770" class="s xs ink">08 / OWNED SEARCH + RECOMMENDATION CORE</text><text x="592" y="802" class="s h2 ink">Algorithms remain project-owned.</text>
  <g transform="translate(592 832)"><rect width="285" height="92" rx="4" class="soft"/><text x="16" y="24" class="m xs ink">SEARCH</text><text x="16" y="49" class="s sm dim">lexical evidence · title · semantic</text><text x="16" y="69" class="s sm dim">quality · freshness · diversity</text><text x="16" y="85" class="s xs dim">PREPARED FEATURE REUSE</text></g>
  <g transform="translate(895 832)"><rect width="285" height="92" rx="4" class="soft"/><text x="16" y="24" class="m xs ink">RECOMMEND</text><text x="16" y="49" class="s sm dim">profile · graph · category · novelty</text><text x="16" y="69" class="s sm dim">freshness · exploration · diversity</text><text x="16" y="85" class="s xs dim">SHARED GRAPH + PREPARED FEATURES</text></g>
  <g transform="translate(1198 832)"><rect width="316" height="92" rx="4" class="lime"/><text x="16" y="24" class="m xs ink">EVALUATION</text><text x="16" y="49" class="s sm ink">search relevance · coverage · freshness</text><text x="16" y="69" class="s sm ink">robustness · holdout · regression</text><text x="16" y="85" class="s xs ink">COUNTERFACTUAL STRATEGY SANDBOX</text></g>

  <!-- cross-plane flows -->
  <path d="M372 263H406" class="flow"/><path d="M1108 263H1142" class="flow"/>
  <path d="M755 368V408" class="flow"/><path d="M930 368V408" class="flow"/>
  <path d="M1144 555H1110" class="flow"/><path d="M1338 698V740" class="flow"/>
  <path d="M300 698V740" class="flow"/><path d="M788 698V740" class="flow"/>
  <path d="M532 851H566" class="flow"/>
</svg>
