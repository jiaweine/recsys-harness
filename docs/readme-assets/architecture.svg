<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">Recsys Harness system architecture</title>
<desc id="desc">Editorial system architecture showing bounded inputs, autonomous control, real tools, evidence, gated evolution, memory, durability, workspace coherence and access boundaries.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#dfe4df" stroke-width="1" opacity=".45"/>
  </pattern>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#315f68"/></marker>
  <marker id="arrowSoft" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#78857e"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#15211f" flood-opacity=".08"/></filter>
</defs>
<style>
  .bg{fill:#f5f6f2}.grid{fill:url(#grid)}.ink{fill:#17211f}.muted{fill:#68756e}.paper{fill:#fffdf9}.paper2{fill:#edf1ed}.dark{fill:#17211f}.teal{fill:#dceaea}.teal2{fill:#2f6069}.warm{fill:#f3e7de}.warm2{fill:#9a5b40}.line{stroke:#c8cfca;stroke-width:1.2}.line2{stroke:#9daaa3;stroke-width:1.2}.flow{fill:none;stroke:#315f68;stroke-width:1.7;marker-end:url(#arrow)}.flowSoft{fill:none;stroke:#78857e;stroke-width:1.3;marker-end:url(#arrowSoft)}.dash{fill:none;stroke:#9daaa3;stroke-width:1.2;stroke-dasharray:6 7}.t{font-family:Inter,"Avenir Next","SF Pro Text","Segoe UI",system-ui,sans-serif;fill:#17211f}.white{fill:#fbfcfa}.mono{font-family:"SFMono-Regular","Cascadia Code",Consolas,monospace}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2.2px}.title{font-size:42px;font-weight:720;letter-spacing:-1.5px}.subtitle{font-size:14px}.h2{font-size:18px;font-weight:760;letter-spacing:-.2px}.h3{font-size:14px;font-weight:760}.body{font-size:12px}.small{font-size:10.5px}.pill{font-size:10px;font-weight:700;letter-spacing:.4px}.num{font-size:10px;font-weight:800}.card{fill:#fffdf9;stroke:#c7cec9;stroke-width:1.2}.cardStrong{fill:#fffdf9;stroke:#17211f;stroke-width:1.35}.round{rx:16}.shadow{filter:url(#shadow)}
</style>

<rect class="bg" width="1600" height="980"/>
<rect class="grid" width="1600" height="980" opacity=".5"/>

<!-- Header -->
<rect class="dark" width="1600" height="132"/>
<text class="t white mono eyebrow" x="52" y="38">RECSYS HARNESS / SYSTEM ARCHITECTURE</text>
<text class="t white title" x="52" y="83">Evidence flows. Authority stays bounded.</text>
<text class="t white subtitle" x="52" y="111" opacity=".72">Autonomous control over real search and recommendation tools — with explicit permission, verification and recovery boundaries.</text>
<g transform="translate(1190 35)">
  <rect x="0" y="0" width="106" height="28" rx="14" fill="#233330" stroke="#42514d"/>
  <text class="t white mono pill" x="18" y="18">LOCAL-FIRST</text>
  <rect x="116" y="0" width="118" height="28" rx="14" fill="#233330" stroke="#42514d"/>
  <text class="t white mono pill" x="134" y="18">MULTIMODAL</text>
  <rect x="244" y="0" width="112" height="28" rx="14" fill="#233330" stroke="#42514d"/>
  <text class="t white mono pill" x="263" y="18">RECOVERABLE</text>
  <text class="t white mono small" x="0" y="58" opacity=".64">OWNED CONTROL · REAL TOOLS · GATED LEARNING</text>
</g>

<!-- Section labels -->
<text class="t mono eyebrow" x="52" y="174">01 · INPUT / PERCEPTION</text>
<text class="t mono eyebrow" x="430" y="174">02 · AUTONOMOUS CONTROL CORE</text>
<text class="t mono eyebrow" x="1160" y="174">03 · EXTERNAL EVIDENCE</text>

<!-- Input card -->
<g class="shadow">
  <rect class="cardStrong" x="52" y="194" width="320" height="284" rx="18"/>
</g>
<rect class="teal2" x="52" y="194" width="6" height="284" rx="3"/>
<circle cx="84" cy="228" r="13" fill="#dceaea"/><text class="t mono num" x="78" y="232">01</text>
<text class="t h2" x="110" y="233">Goal + context</text>
<text class="t muted body" x="82" y="267">Natural-language objective</text>
<text class="t muted body" x="82" y="293">Screenshot / pasted image</text>
<text class="t muted body" x="82" y="319">JSON · CSV · Markdown · TXT</text>
<text class="t muted body" x="82" y="345">Per-run network permission</text>
<line class="line" x1="82" y1="367" x2="342" y2="367"/>
<text class="t mono small" x="82" y="392">PERCEPTION BOUNDARY</text>
<text class="t body" x="82" y="418">Local parsing + bounded optional vision</text>
<text class="t muted small" x="82" y="442">Observations can inform decisions.</text>
<text class="t muted small" x="82" y="459">They can never grant permission.</text>

<!-- Core -->
<g class="shadow">
  <rect class="dark" x="430" y="194" width="674" height="284" rx="22"/>
</g>
<text class="t white mono eyebrow" x="462" y="226">EVIDENCE-UTILITY CONTROLLER</text>
<text class="t white h2" x="462" y="254">Recompute the next action after every observation.</text>
<text class="t white small" x="462" y="277" opacity=".62">No one-shot plan. No hidden authority escalation.</text>

<g transform="translate(462 308)">
  <rect x="0" y="0" width="136" height="84" rx="14" fill="#24312f" stroke="#41514d"/>
  <text class="t white mono num" x="18" y="25">01</text><text class="t white h3" x="18" y="49">Observe</text><text class="t white small" x="18" y="69" opacity=".58">state · evidence</text>
  <rect x="154" y="0" width="136" height="84" rx="14" fill="#dceaea" stroke="#7fa2a6"/>
  <text class="t mono num" x="172" y="25" fill="#2f6069">02</text><text class="t h3" x="172" y="49">Decide</text><text class="t muted small" x="172" y="69">gap · utility · cost</text>
  <rect x="308" y="0" width="136" height="84" rx="14" fill="#24312f" stroke="#41514d"/>
  <text class="t white mono num" x="326" y="25">03</text><text class="t white h3" x="326" y="49">Execute</text><text class="t white small" x="326" y="69" opacity=".58">risk-checked tool</text>
  <rect x="462" y="0" width="148" height="84" rx="14" fill="#24312f" stroke="#41514d"/>
  <text class="t white mono num" x="480" y="25">04</text><text class="t white h3" x="480" y="49">Verify / Replan</text><text class="t white small" x="480" y="69" opacity=".58">checkpoint · next step</text>
  <path d="M136 42H154M290 42H308M444 42H462" stroke="#8fb6b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M536 84C536 120 68 120 68 84" fill="none" stroke="#78908a" stroke-width="1.2" marker-end="url(#arrowSoft)"/>
</g>

<g transform="translate(462 415)">
  <rect x="0" y="0" width="288" height="40" rx="10" fill="#202c2a" stroke="#3b4945"/>
  <text class="t white mono small" x="16" y="25" opacity=".72">BOUNDARIES · time · tools · cost · permission</text>
  <rect x="304" y="0" width="338" height="40" rx="10" fill="#202c2a" stroke="#3b4945"/>
  <text class="t white mono small" x="320" y="25" opacity=".72">PROVENANCE · choice · alternatives · learned utility</text>
</g>

<!-- External evidence -->
<g class="shadow">
  <rect class="cardStrong" x="1160" y="194" width="388" height="284" rx="18"/>
</g>
<rect class="warm2" x="1160" y="194" width="6" height="284" rx="3"/>
<circle cx="1192" cy="228" r="13" fill="#f3e7de"/><text class="t mono num" x="1186" y="232">03</text>
<text class="t h2" x="1218" y="233">Permissioned research</text>
<text class="t muted body" x="1190" y="267">Available only when configured + allowed.</text>
<text class="t muted body" x="1190" y="293">Returns title · URL · snippet with provenance.</text>
<rect class="warm" x="1190" y="320" width="328" height="54" rx="12"/>
<text class="t mono small" x="1208" y="342" fill="#9a5b40">NETWORK ≠ STRATEGY PROMOTION</text>
<text class="t body" x="1208" y="361">Public evidence never becomes promotion data.</text>
<line class="line" x1="1190" y1="396" x2="1518" y2="396"/>
<text class="t h3" x="1190" y="424">Evidence ledger</text>
<text class="t muted small" x="1190" y="447">result · diagnostic · external source</text>
<text class="t muted small" x="1190" y="464">verifier sees provenance, not just prose</text>

<!-- Top flows -->
<path class="flow" d="M372 328H430"/>
<path class="flowSoft" d="M1104 286H1160"/>
<path class="flow" d="M1160 414H1104"/>

<!-- Tool plane -->
<text class="t mono eyebrow" x="52" y="532">04 · REAL TOOL PLANE</text>
<g class="shadow"><rect class="cardStrong" x="52" y="552" width="986" height="178" rx="18"/></g>
<text class="t h2" x="82" y="590">Capabilities carry explicit risk contracts.</text>
<text class="t muted small" x="82" y="613">The controller chooses tools; handlers do real work; risk class stays visible.</text>
<g transform="translate(82 638)">
  <rect class="paper2" x="0" y="0" width="164" height="58" rx="12"/><text class="t mono h3" x="16" y="24">data.inspect</text><text class="t muted small" x="16" y="43">read</text>
  <rect class="paper2" x="176" y="0" width="164" height="58" rx="12"/><text class="t mono h3" x="192" y="24">search.*</text><text class="t muted small" x="192" y="43">read · simulation</text>
  <rect class="paper2" x="352" y="0" width="164" height="58" rx="12"/><text class="t mono h3" x="368" y="24">recommend.*</text><text class="t muted small" x="368" y="43">read · simulation</text>
  <rect class="teal" x="528" y="0" width="164" height="58" rx="12"/><text class="t mono h3" x="544" y="24">*.evolve</text><text class="t muted small" x="544" y="43">adaptive</text>
  <rect class="warm" x="704" y="0" width="164" height="58" rx="12"/><text class="t mono h3" x="720" y="24">web.research</text><text class="t muted small" x="720" y="43">network</text>
</g>
<path class="flow" d="M766 478V552"/>

<!-- Evolution -->
<text class="t mono eyebrow" x="1080" y="532">05 · EVOLUTION / TRUST</text>
<g class="shadow"><rect class="cardStrong" x="1080" y="552" width="468" height="178" rx="18"/></g>
<text class="t h2" x="1110" y="590">Learning must survive independent evidence.</text>
<g transform="translate(1110 625)">
  <rect class="paper2" x="0" y="0" width="92" height="62" rx="11"/><text class="t mono num" x="14" y="21">01</text><text class="t small" x="14" y="42">Discover</text>
  <rect class="paper2" x="104" y="0" width="92" height="62" rx="11"/><text class="t mono num" x="118" y="21">02</text><text class="t small" x="118" y="42">Holdout</text>
  <rect class="paper2" x="208" y="0" width="92" height="62" rx="11"/><text class="t mono num" x="222" y="21">03</text><text class="t small" x="222" y="42">Regress</text>
  <rect class="teal" x="312" y="0" width="126" height="62" rx="11"/><text class="t mono num" x="326" y="21">04</text><text class="t small" x="326" y="42">Trust / activate</text>
  <path d="M92 31H104M196 31H208M300 31H312" stroke="#6c8885" stroke-width="1.3" marker-end="url(#arrowSoft)"/>
</g>
<text class="t muted small" x="1110" y="711">Activation still requires user permission · future drift can retire the strategy.</text>

<!-- State plane -->
<text class="t mono eyebrow" x="52" y="786">06 · MEMORY / DURABILITY / WORKSPACE / ACCESS</text>
<g class="shadow"><rect class="dark" x="52" y="806" width="1496" height="126" rx="20"/></g>
<g transform="translate(76 828)">
  <rect x="0" y="0" width="330" height="82" rx="14" fill="#22302d" stroke="#3b4945"/>
  <text class="t white mono small" x="18" y="23" opacity=".62">MEMORY</text><text class="t white h3" x="18" y="47">Episodic · procedural · policy utility</text><text class="t white small" x="18" y="67" opacity=".58">bounded recall · trusted strategy fingerprints</text>
  <rect x="346" y="0" width="330" height="82" rx="14" fill="#22302d" stroke="#3b4945"/>
  <text class="t white mono small" x="364" y="23" opacity=".62">DURABILITY</text><text class="t white h3" x="364" y="47">Checkpoint · lease · heartbeat · fencing</text><text class="t white small" x="364" y="67" opacity=".58">idempotent recovery · monotonic terminal state</text>
  <rect x="692" y="0" width="330" height="82" rx="14" fill="#22302d" stroke="#3b4945"/>
  <text class="t white mono small" x="710" y="23" opacity=".62">WORKSPACE</text><text class="t white h3" x="710" y="47">Shared revision + update lock</text><text class="t white small" x="710" y="67" opacity=".58">workers reload one coherent catalog</text>
  <rect x="1038" y="0" width="410" height="82" rx="14" fill="#22302d" stroke="#3b4945"/>
  <text class="t white mono small" x="1056" y="23" opacity=".62">ACCESS</text><text class="t white h3" x="1056" y="47">Optional auth · shared rate limits · CSP</text><text class="t white small" x="1056" y="67" opacity=".58">production boundary without changing the control core</text>
</g>
<path class="flowSoft" d="M910 730V806"/>
<path class="flowSoft" d="M1314 730V806"/>

<!-- Footer invariants -->
<line class="line2" x1="52" y1="954" x2="1548" y2="954" opacity=".55"/>
<text class="t mono small" x="52" y="974">INVARIANTS · attachments never grant permission · network evidence never promotes strategy · holdout precedes trust · stale workers cannot overwrite current state</text>
</svg>
